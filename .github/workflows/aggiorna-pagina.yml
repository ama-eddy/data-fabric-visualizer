# [REQ-CFG-08] Quando cambiano i testi o i sorgenti, rigenera fabbrica-dati.html e lo salva su main:
# GitHub Pages pubblica poi la nuova versione. Se TESTI.md ha un errore (chiave sbagliata, termine
# tecnico vietato), l'azione diventa rossa con l'elenco dei problemi e la pagina pubblica non cambia.
name: Aggiorna la pagina
on:
  push:
    branches: [main]
    paths: ['TESTI.md', 'src/**', 'tools/**', 'build.mjs', 'package.json', 'package-lock.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency: aggiorna-pagina
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: node build.mjs
      - name: Salva la pagina aggiornata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fabbrica-dati.html
          git diff --cached --quiet && echo "Pagina già aggiornata" && exit 0
          git commit -m "Aggiorna fabbrica-dati.html"
          git push
