<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fabbrica Dati</title>
<style>
  :root { --bg: rgba(15,23,42,.88); --fg: #f1f5f9; --muted: #94a3b8; --line: rgba(148,163,184,.25); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #dfe8ee; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--fg); }
  #scene, #labels { position: fixed; inset: 0; }
  #labels { pointer-events: none; }
  .panel { position: fixed; background: var(--bg); backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(15,23,42,.25); }
  #left { top: 14px; left: 14px; width: 318px; max-height: calc(100% - 28px); display: flex; flex-direction: column; }
  #left header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  #left h1 { margin: 0; font-size: 19px; letter-spacing: .2px; }
  #left header p { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); }
  #left h2 { margin: 12px 16px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); }
  #wl { overflow-y: auto; padding: 0 8px 8px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 8px; }
  .row:hover { background: rgba(148,163,184,.12); }
  .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
  .row .name { flex: 1; font-size: 13.5px; cursor: pointer; background: none; border: 0; color: inherit; text-align: left; padding: 2px 0; font-family: inherit; }
  .row[data-stato="off"] .name { color: var(--muted); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; flex: none; }
  .seg button { background: none; border: 0; color: var(--muted); font: 600 10.5px/1 inherit; font-family: inherit; padding: 6px 7px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.sel[data-s="off"] { background: #475569; color: #fff; }
  .seg button.sel[data-s="wip"] { background: #f59e0b; color: #1f2937; }
  .seg button.sel[data-s="on"]  { background: #22c55e; color: #052e16; }
  #bar { top: 14px; left: 346px; padding: 6px; display: flex; gap: 6px; flex-wrap: wrap; max-width: calc(100% - 360px); }
  #bar button { background: rgba(148,163,184,.14); border: 1px solid var(--line); color: var(--fg); font: 500 12.5px inherit; font-family: inherit; padding: 7px 11px; border-radius: 8px; cursor: pointer; }
  #bar button:hover { background: rgba(148,163,184,.28); }
  #info { top: 62px; right: 14px; width: 348px; max-height: calc(100% - 110px); overflow-y: auto; padding: 16px 18px; display: none; }
  #info.open { display: block; }
  #info h3 { margin: 0 26px 8px 0; font-size: 18px; }
  #info .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
  .badge { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; color: #fff; }
  .badge.stato { background: #334155; }
  #info h4 { margin: 14px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 1.1px; color: var(--muted); }
  #info p { margin: 0; font-size: 14px; line-height: 1.5; }
  #info .x { position: absolute; top: 10px; right: 12px; background: none; border: 0; color: var(--muted); font-size: 20px; cursor: pointer; }
  #hint { bottom: 12px; left: 50%; transform: translateX(-50%); padding: 7px 14px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  #tip { position: fixed; pointer-events: none; background: #0f172a; color: #fff; font-size: 12px; padding: 4px 8px; border-radius: 6px; display: none; z-index: 5; }
  .lbl { font: 600 12px "Segoe UI", system-ui, sans-serif; color: #0f172a; background: rgba(255,255,255,.92); border-left: 4px solid #64748b; padding: 3px 8px; border-radius: 5px; white-space: nowrap; box-shadow: 0 2px 6px rgba(15,23,42,.18); }
  .lbl.wip { background: #fef3c7; }
  .lbl small { font-weight: 500; color: #92400e; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #0f172a; color: #fff; padding: 40px; text-align: center; font-size: 16px; }
</style>
</head>
<body>
<div id="scene"></div>
<div id="labels"></div>
<aside id="left" class="panel"><header><h1 id="titolo"></h1><p id="sottotitolo"></p></header><h2 id="wl-h"></h2><div id="wl"></div></aside>
<nav id="bar" class="panel"></nav>
<aside id="info" class="panel"></aside>
<div id="hint" class="panel"></div>
<div id="tip"></div>
<div id="err"></div>
<script>
/*@CONFIG*/
</script>
<script>
/*@PROFILE*/
</script>
<script>
/*@BUNDLE*/
</script>
</body>
</html>
