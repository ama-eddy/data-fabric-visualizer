<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fabbrica Dati</title>
<style>
  :root { --bg: rgba(15,23,42,.88); --fg: #f1f5f9; --muted: #94a3b8; --line: rgba(148,163,184,.25); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #dfe8ee; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--fg); }
  #scene, #labels { position: fixed; inset: 0; }
  #labels { pointer-events: none; }
  .panel { position: fixed; background: var(--bg); backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(15,23,42,.25); }
  #left { top: 14px; left: 14px; width: 318px; max-height: calc(100% - 28px); display: flex; flex-direction: column; }
  #left header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  #left h1 { margin: 0; font-size: 19px; letter-spacing: .2px; }
  #left header p { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); }
  #left h2 { margin: 12px 16px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); }
  #wl { overflow-y: auto; padding: 0 8px 8px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 8px; }
  .row:hover { background: rgba(148,163,184,.12); }
  .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
  .row .name { flex: 1; font-size: 13.5px; cursor: pointer; background: none; border: 0; color: inherit; text-align: left; padding: 2px 0; font-family: inherit; }
  .row[data-stato="off"] .name { color: var(--muted); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; flex: none; }
  .seg button { background: none; border: 0; color: var(--muted); font: 600 10.5px/1 inherit; font-family: inherit; padding: 6px 7px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.sel[data-s="off"] { background: #475569; color: #fff; }
  .seg button.sel[data-s="wip"] { background: #f59e0b; color: #1f2937; }
  .seg button.sel[data-s="on"]  { background: #22c55e; color: #052e16; }
  #bar { top: 14px; left: 346px; padding: 6px; display: flex; gap: 6px; flex-wrap: wrap; max-width: calc(100% - 346px - 430px); }
  #bar button { background: rgba(148,163,184,.14); border: 1px solid var(--line); color: var(--fg); font: 500 12.5px inherit; font-family: inherit; padding: 7px 11px; border-radius: 8px; cursor: pointer; }
  #bar button:hover { background: rgba(148,163,184,.28); }
  #team { top: 14px; right: 14px; padding: 8px 12px 9px; }
  #team h2 { margin: 0 0 5px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.1px; color: var(--muted); }
  .pupazzi { display: flex; gap: 6px; flex-wrap: wrap; max-width: 392px; min-height: 44px; }
  .gruppo { text-align: center; }
  .gruppo small { display: block; font-size: 10px; color: var(--muted); max-width: 52px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .testa { display: flex; align-items: center; gap: 5px; margin-bottom: 6px; } .testa h2 { flex: 1; margin: 0 !important; }
  .tasto { background: rgba(148,163,184,.16); border: 1px solid var(--line); color: var(--fg); border-radius: 7px; cursor: pointer; font: 700 14px inherit; font-family: inherit; height: 28px; padding: 0 7px; display: inline-flex; align-items: center; gap: 1px; }
  .tasto:hover { background: rgba(148,163,184,.32); } .tasto svg { width: 12px; height: 18px; } .tasto.azzera { font-weight: 500; font-size: 11.5px; color: var(--muted); }
  .pallini { display: flex; gap: 3px; justify-content: center; flex-wrap: wrap; max-width: 44px; margin: 3px auto 0; min-height: 10px; }
  .pallino { width: 10px; height: 10px; border-radius: 50%; border: 1px solid rgba(255,255,255,.6); padding: 0; cursor: pointer; }
  .pallino:hover { outline: 2px solid #fff; }
  #team .aiuto { margin-top: 4px; }
  .row.sopra { background: rgba(250,204,21,.28) !important; outline: 2px dashed #facc15; }
  body.trascino #wl > .row { outline: 1px dashed rgba(250,204,21,.45); }
  .row.scoperto .name::after { content: ' ⚠'; color: #fbbf24; }
  .lbl.scoperta::after { content: ' ⚠'; color: #b45309; }
  #info .avviso { font-size: 13px; color: #fbbf24; margin: 6px 0 2px; }
  #info .compito { margin: 0 0 8px; font-size: 13.5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 4px; }
  .chip2 { background: none; border: 1.5px solid; color: var(--fg); border-radius: 999px; font: 500 11.5px inherit; font-family: inherit; padding: 3px 9px; cursor: pointer; }
  .chip2.on { color: #fff; font-weight: 600; }
  .pupazzo { background: rgba(148,163,184,.14); border: 1px solid var(--line); border-radius: 8px; padding: 3px 6px 1px; cursor: pointer; }
  .pupazzo:hover { background: rgba(148,163,184,.3); }
  .pupazzo.sel { background: #facc15; border-color: #facc15; }
  .apri { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 12px; width: 14px; padding: 0; margin-left: -4px; }
  .sub { display: none; margin: 0 0 4px 22px; border-left: 2px solid var(--line); padding-left: 4px; }
  .sub.open { display: block; }
  .subrow { padding: 2px 6px; }
  .subrow .name { font-size: 12.5px; }
  .subrow .name small { display: block; font-size: 10.5px; color: var(--muted); }
  .subrow[data-stato="off"] .name { color: var(--muted); }
  #info { top: 118px; right: 14px; width: 348px; max-height: calc(100% - 110px); overflow-y: auto; padding: 16px 18px; display: none; }
  #info.open { display: block; }
  #info h3 { margin: 0 26px 8px 0; font-size: 18px; }
  #info .tecnico { font-size: 12.5px; color: #cbd5e1; background: rgba(148,163,184,.14); border-radius: 6px; padding: 4px 8px; margin: -2px 0 8px; display: inline-block; }
  #info .tecnico b { color: var(--muted); font-weight: 600; }
  #info .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
  .badge { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; color: #fff; }
  .badge.stato { background: #334155; }
  #info h4 { margin: 14px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 1.1px; color: var(--muted); }
  #info p { margin: 0; font-size: 14px; line-height: 1.5; }
  #info .x { position: absolute; top: 10px; right: 12px; background: none; border: 0; color: var(--muted); font-size: 20px; cursor: pointer; }
  #legenda { bottom: 14px; left: 346px; right: 14px; width: fit-content; max-width: calc(100% - 360px); padding: 8px 14px; display: none; font-size: 12.5px; }
  #legenda.open { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center; }
  #legenda h4 { margin: 0; font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.1px; color: var(--muted); }
  #legenda .riga { display: flex; flex-wrap: wrap; gap: 2px 14px; }
  .voce { display: flex; align-items: center; gap: 6px; }
  .chip { width: 13px; height: 13px; border-radius: 3px; flex: none; border: 1px solid rgba(255,255,255,.35); }
  .chip.linea { height: 5px; border-radius: 3px; width: 20px; }
  #info .seg { display: inline-flex; }
  #hint { padding: 9px 16px 12px; font-size: 11.5px; line-height: 1.45; color: var(--muted); border-top: 1px solid var(--line); }
  /* narrativa e percorsi [REQ-NAR-07]: testo leggibile a distanza */
  #guida { left: 50%; transform: translateX(-50%); bottom: 16px; width: min(920px, calc(100% - 32px)); padding: 16px 22px 12px; display: none; border-top: 5px solid #64748b; z-index: 4; }
  #guida.open { display: block; }
  body.percorso:not(.compatto) #guida { left: 346px; right: 14px; transform: none; width: auto; max-width: 920px; }   /* durante un percorso il pannello dei workload resta visibile */
  #guida .passo { font-size: 12px; text-transform: uppercase; letter-spacing: 1.3px; color: var(--muted); }
  #guida h3 { margin: 4px 0 6px; font-size: 25px; }
  #guida .testo { margin: 0 0 8px; font-size: 20px; line-height: 1.45; }
  #guida .riga { margin: 0 0 4px; font-size: 16px; color: #e2e8f0; } #guida .riga b { color: var(--muted); font-weight: 600; }
  .nav { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
  .nav button, #bar button.primario { background: rgba(148,163,184,.16); border: 1px solid var(--line); color: var(--fg); font: 600 14px inherit; font-family: inherit; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
  .nav button:disabled { opacity: .35; cursor: default; }
  .nav button.primario, #bar button.primario { background: #2563eb; border-color: #2563eb; color: #fff; }
  .nav button.sec { font-weight: 500; color: var(--muted); }
  .aiuto { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  body.presenta #left, body.presenta #bar, body.presenta #legenda, body.presenta #apri-menu, body.percorso #legenda { display: none !important; }
  .num { width: 26px; height: 26px; border-radius: 50%; color: #fff; font: 700 14px "Segoe UI", system-ui, sans-serif; display: flex; align-items: center; justify-content: center; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,.4); pointer-events: auto; cursor: pointer; }
  .num.ora { width: 38px; height: 38px; font-size: 19px; }
  .ancora { position: relative; display: inline-flex; }
  .tendina { display: none; position: absolute; top: 40px; left: 0; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 6px; width: 330px; z-index: 6; box-shadow: 0 10px 30px rgba(15,23,42,.35); }
  .tendina.open { display: block; }
  #bar .tendina button { display: block; width: 100%; text-align: left; border: 0; border-left: 4px solid; border-radius: 4px; margin: 3px 0; padding: 7px 10px; }
  .tendina b { display: block; font-size: 13.5px; } .tendina small { color: var(--muted); font-size: 11px; }
  #benvenuto { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(15,23,42,.55); z-index: 10; }
  #benvenuto.open { display: flex; }
  .carta { background: #0f172a; border: 1px solid var(--line); border-radius: 16px; padding: 28px 34px 22px; width: min(640px, calc(100% - 32px)); box-shadow: 0 20px 60px rgba(0,0,0,.45); }
  .carta h2 { margin: 0 0 12px; font-size: 28px; } .carta p { font-size: 17px; line-height: 1.5; margin: 0 0 10px; }
  #apri-menu { display: none; top: 14px; left: 14px; width: 40px; height: 40px; color: var(--fg); font-size: 18px; cursor: pointer; z-index: 3; }
  body.compatto #apri-menu { display: block; } body.compatto #left { display: none; } body.compatto #bar { left: 62px; max-width: calc(100% - 62px - 430px); } body.compatto #legenda { left: 14px; max-width: calc(100% - 28px); }
  @media (max-width: 1279px) { #apri-menu { display: block; } #left { top: 60px; max-height: calc(100% - 74px); z-index: 5; } #bar { left: 62px; max-width: calc(100% - 76px); } #legenda { left: 14px; max-width: calc(100% - 28px); } #team { top: 108px; } #info { top: 212px; width: min(348px, calc(100% - 28px)); } }
  #fps { position: fixed; bottom: 4px; right: 6px; font: 11px monospace; color: #0f172a; background: rgba(255,255,255,.7); padding: 1px 5px; border-radius: 4px; display: none; z-index: 9; }
  #tip { position: fixed; pointer-events: none; background: #0f172a; color: #fff; font-size: 12px; padding: 4px 8px; border-radius: 6px; display: none; z-index: 5; }
  .lbl { font: 600 12px "Segoe UI", system-ui, sans-serif; color: #0f172a; background: rgba(255,255,255,.92); border-left: 4px solid #64748b; padding: 3px 8px; border-radius: 5px; white-space: nowrap; box-shadow: 0 2px 6px rgba(15,23,42,.18); }
  .lbl { transition: opacity .18s; }
  .lbl.nascosta { opacity: 0; }
  .lbl.wip { background: #fef3c7; }
  .lbl small { font-weight: 500; color: #92400e; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #0f172a; color: #fff; padding: 40px; text-align: center; font-size: 16px; }
</style>
</head>
<body>
<div id="scene"></div>
<div id="labels"></div>
<aside id="left" class="panel"><header><h1 id="titolo"></h1><p id="sottotitolo"></p></header><h2 id="wl-h"></h2><div id="wl"></div><div id="hint"></div></aside>
<nav id="bar" class="panel"></nav>
<aside id="team" class="panel"></aside>
<aside id="info" class="panel"></aside>
<aside id="legenda" class="panel open"></aside>
<aside id="guida" class="panel"></aside>
<div id="benvenuto"></div>
<div id="fps"></div>
<div id="tip"></div>
<div id="err"></div>
<script>

</script>
<script>

</script>
<script>

<script>

</script>
</body>
</html>
