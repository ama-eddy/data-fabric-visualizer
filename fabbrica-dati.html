<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fabbrica Dati</title>
<style>
  :root { --bg: rgba(15,23,42,.88); --fg: #f1f5f9; --muted: #94a3b8; --line: rgba(148,163,184,.25); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #dfe8ee; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; color: var(--fg); }
  #scene, #labels { position: fixed; inset: 0; }
  #labels { pointer-events: none; }
  .panel { position: fixed; background: var(--bg); backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 10px 30px rgba(15,23,42,.25); }
  #left { top: 14px; left: 14px; width: 318px; max-height: calc(100% - 28px); display: flex; flex-direction: column; }
  #left header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  #left h1 { margin: 0; font-size: 19px; letter-spacing: .2px; }
  #left header p { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); }
  #left h2 { margin: 12px 16px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); }
  #wl { overflow-y: auto; padding: 0 8px 8px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 8px; }
  .row:hover { background: rgba(148,163,184,.12); }
  .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
  .row .name { flex: 1; font-size: 13.5px; cursor: pointer; background: none; border: 0; color: inherit; text-align: left; padding: 2px 0; font-family: inherit; }
  .row[data-stato="off"] .name { color: var(--muted); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; flex: none; }
  .seg button { background: none; border: 0; color: var(--muted); font: 600 10.5px/1 inherit; font-family: inherit; padding: 6px 7px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.sel[data-s="off"] { background: #475569; color: #fff; }
  .seg button.sel[data-s="wip"] { background: #f59e0b; color: #1f2937; }
  .seg button.sel[data-s="on"]  { background: #22c55e; color: #052e16; }
  #bar { top: 14px; left: 346px; padding: 6px; display: flex; gap: 6px; flex-wrap: wrap; max-width: calc(100% - 360px); }
  #bar button { background: rgba(148,163,184,.14); border: 1px solid var(--line); color: var(--fg); font: 500 12.5px inherit; font-family: inherit; padding: 7px 11px; border-radius: 8px; cursor: pointer; }
  #bar button:hover { background: rgba(148,163,184,.28); }
  #team { top: 14px; right: 14px; padding: 8px 12px 9px; }
  #team h2 { margin: 0 0 5px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.1px; color: var(--muted); }
  .pupazzi { display: flex; gap: 5px; flex-wrap: wrap; max-width: 300px; }
  .pupazzo { background: rgba(148,163,184,.14); border: 1px solid var(--line); border-radius: 8px; padding: 3px 6px 1px; cursor: pointer; }
  .pupazzo:hover { background: rgba(148,163,184,.3); }
  .pupazzo.sel { background: #facc15; border-color: #facc15; }
  .pupazzo.off { opacity: .35; }
  .apri { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 12px; width: 14px; padding: 0; margin-left: -4px; }
  .sub { display: none; margin: 0 0 4px 22px; border-left: 2px solid var(--line); padding-left: 4px; }
  .sub.open { display: block; }
  .subrow { padding: 2px 6px; }
  .subrow .name { font-size: 12.5px; }
  .subrow .name small { display: block; font-size: 10.5px; color: var(--muted); }
  .subrow[data-stato="off"] .name { color: var(--muted); }
  #info { top: 82px; right: 14px; width: 348px; max-height: calc(100% - 110px); overflow-y: auto; padding: 16px 18px; display: none; }
  #info.open { display: block; }
  #info h3 { margin: 0 26px 8px 0; font-size: 18px; }
  #info .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
  .badge { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; color: #fff; }
  .badge.stato { background: #334155; }
  #info h4 { margin: 14px 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 1.1px; color: var(--muted); }
  #info p { margin: 0; font-size: 14px; line-height: 1.5; }
  #info .x { position: absolute; top: 10px; right: 12px; background: none; border: 0; color: var(--muted); font-size: 20px; cursor: pointer; }
  #legenda { bottom: 14px; left: 346px; right: 14px; width: fit-content; max-width: calc(100% - 360px); padding: 8px 14px; display: none; font-size: 12.5px; }
  #legenda.open { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: center; }
  #legenda h4 { margin: 0; font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.1px; color: var(--muted); }
  #legenda .riga { display: flex; flex-wrap: wrap; gap: 2px 14px; }
  .voce { display: flex; align-items: center; gap: 6px; }
  .chip { width: 13px; height: 13px; border-radius: 3px; flex: none; border: 1px solid rgba(255,255,255,.35); }
  .chip.linea { height: 5px; border-radius: 3px; width: 20px; }
  #info .seg { display: inline-flex; }
  #hint { padding: 9px 16px 12px; font-size: 11.5px; line-height: 1.45; color: var(--muted); border-top: 1px solid var(--line); }
  #tip { position: fixed; pointer-events: none; background: #0f172a; color: #fff; font-size: 12px; padding: 4px 8px; border-radius: 6px; display: none; z-index: 5; }
  .lbl { font: 600 12px "Segoe UI", system-ui, sans-serif; color: #0f172a; background: rgba(255,255,255,.92); border-left: 4px solid #64748b; padding: 3px 8px; border-radius: 5px; white-space: nowrap; box-shadow: 0 2px 6px rgba(15,23,42,.18); }
  .lbl.wip { background: #fef3c7; }
  .lbl small { font-weight: 500; color: #92400e; }
  #err { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #0f172a; color: #fff; padding: 40px; text-align: center; font-size: 16px; }
</style>
</head>

<aside id="team" class="panel"></aside>
<aside id="info" class="panel"></aside>
<aside id="legenda" class="panel open"></aside>
<div id="tip"></div>

semblaggio: i pezzi puliti vengono montati in componenti pensati per il business (vendite, clienti, costi).","elements.gold.perTe":"I dati di sistemi diversi vengono messi insieme: finalmente il cliente del CRM e quello del gestionale sono la stessa cosa.","elements.confezionamento.nome":"Confezionamento semilavorati","elements.confezionamento.fabbrica":"Il confezionamento: i componenti diventano semilavorati, con le istruzioni dentro e il marchio di qualità sopra.","elements.confezionamento.perTe":"Il semilavorato è un dato certificato, con i calcoli già pronti: lo stesso per tutti, pronto per costruirci i report.","elements.spedizioni.nome":"Spedizioni","elements.spedizioni.fabbrica":"Il reparto spedizioni: da qui i semilavorati collaudati partono verso le officine delle funzioni.","elements.spedizioni.perTe":"È da qui che i dati certificati arrivano alla tua funzione.","elements.showroom.nome":"Showroom","elements.showroom.fabbrica":"Lo showroom dell'hub, accanto alla fabbrica: i prodotti finiti ufficiali, costruiti dal team dati sui semilavorati collaudati e uguali per tutta l'azienda.","elements.showroom.perTe":"Sono i report ufficiali, in Power BI: li apri e leggi il numero, senza costruire nulla. È lo stesso numero che vedono tutti.","elements.coordinamento.nome":"Ufficio di coordinamento","elements.coordinamento.fabbrica":"L'ufficio da cui si coordinano tutti gli operatori della fabbrica: chi fa cosa, in che ordine, entro quando.","elements.coordinamento.perTe":"Quando chiedi qualcosa, è qui che la richiesta trova posto nel piano di lavoro e un responsabile.","elements.cancelli.nome":"Cancelli e tornelli","elements.cancelli.fabbrica":"Il cancello, i tornelli e il lettore di badge: si entra solo se autorizzati, e ognuno raggiunge solo i reparti che gli servono.","elements.cancelli.perTe":"Per far entrare una persona della tua funzione si chiede un badge: decidi tu chi entra e che cosa può fare.","elements.recinzione.nome":"Recinzione e telecamere","elements.r ico e archivio","materiali.grezzo.nome":"Grezzo","materiali.bronze.nome":"Bronze — conservato","materiali.silver.nome":"Silver — pulito","materiali.gold.nome":"Gold — assemblato","materiali.semilavorato.nome":"Semilavorato certificato","materiali.report.nome":"Report — prodotto finito","modalita.copy.nome":"Scivolo","modalita.copy.testo":"A orari stabiliti il materiale scivola dal fornitore nel lago dei dati; da lì il team dati lo pesca e lo porta nel magazzino.","modalita.dataflow.nome":"Scialuppa","modalita.dataflow.testo":"Il materiale attraversa il lago su una scialuppa che lo sistema un po' già durante il viaggio, poi lo lascia al pontile.","modalita.mirroring.nome":"Condotta continua","modalita.mirroring.testo":"Una copia sempre aggiornata scorre senza sosta in una condotta che scavalca il lago ed entra direttamente nel magazzino.","modalita.shortcut.nome":"Ponte di vetro","modalita.shortcut.testo":"Il materiale non si sposta: resta dal fornitore e la fabbrica lo usa attraverso un ponte sopra il lago, senza copiarlo.","modalita.streaming.nome":"Nastro veloce","modalita.streaming.testo":"Il materiale arriva in diretta, un pezzo dopo l'altro, alla sala sensori: funziona solo quando il Real-Time è attivo.","categorie.erp.nome":"ERP","categorie.erp.fabbrica":"Un grande stabilimento: il fornitore principale, con tanto materiale ben organizzato.","categorie.erp.perTe":"È il gestionale: ordini, fatture, contabilità, acquisti.","categorie.crm.nome":"CRM","categorie.crm.fabbrica":"Un negozio: qui nasce tutto ciò che riguarda il rapporto con i clienti.","categorie.crm.perTe":"È il sistema dove si seguono clienti, contatti, offerte e trattative.","categorie.pim.nome":"PIM","categorie.pim.fabbrica":"La sala cataloghi: schede ordinate di ogni prodotto, con codici, descrizioni e immagini.","categorie.pim.perTe":"È il sistema che tiene le informazioni sui prodotti: codici, caratteristiche, descrizioni, listini.","categorie.hr.nome":"HR","categorie.hr.fabbrica":"Una palazzina di uffici: le informazioni sulle persone dell'azienda.","categorie.hr.perTe":"È il sistema del personale: organico, presenze, paghe. Sono dati delicati, protetti dalle regole su chi vede cosa.","categorie.mes.nome":"Produzione e magazzino","categorie.mes.fabbrica":"Dei silos: materiale già stoccato in modo ordinato, che scorre in continuazione.","categorie.mes.perTe":"Sono i sistemi della produzione e del magazzino: giacenze, lotti, avanzamento degli ordini.","categorie.ecommerce.nome":"E-commerce","categorie.ecommerce.fabbrica":"Un centro pacchi: ordini che arrivano dal negozio online, uno dopo l'altro.","categorie.ecommerce.perTe":"È il negozio online: ordini, carrelli, resi, comportamento dei clienti sul sito.","categorie.marketing.nome":"Marketing","categorie.marketing.fabbrica":"Uno sportello: si chiede e si riceve, un pezzo alla volta.","categorie.marketing.perTe":"Sono i servizi di marketing a cui l'azienda è abbonata: campagne, newsletter, social.","categorie.excel.nome":"Fogli di calcolo","categorie.excel.fabbrica":"Un archivio di scatoloni: materiale sfuso, preparato a mano.","categorie.excel.perTe":"Sono i fogli di calcolo che oggi qualcuno compila e si passa a mano: budget, previsioni, tabelle di appoggio.","categorie.iot.nome":"Sensori","categorie.iot.fabbrica":"Un campo di sensori: il materiale arriva in continuazione, senza pause.","categorie.iot.perTe":"Sono macchine e sensori che mandano segnali in ogni momento.","categorie.esterni.nome":"Dati esterni","categorie.esterni.fabbrica":"Un mercato: materiale che viene da fuori, acquistato o pubblico.","categorie.esterni.perTe":"Sono dati di mercato o dati pubblici che arricchiscono quelli dell'azienda.","categorie.datalake.nome":"Data lake esistente","categorie.datalake.fabbrica":"Un deposito di container: grandi quantità di materiale già raccolto altrove.","categorie.datalake.perTe":"È un archivio dati che l'azienda ha già: si usa così com'è, senza duplicarlo.","sources.src-erp.nome":"Gestionale","sources.src-crm.nome":"CRM","sources.src-pim.nome":"Anagrafica prodotti","sources.src-hr.nome":"Sistema del personale","sources.src-mes.nome":"Produzione e magazzino","sources.src-ecom.nome":"Negozio online","sources.src-mkt.nome":"Marketing","sources.src-excel.nome":"Budget e forecast (Excel)","sources.src-iot.nome":"Sensori di impianto","sources.src-ext.nome":"Dati di mercato","sources.src-lake.nome":"Archivio dati esistente","spoke.fabbrica":"L'officina della funzione: riceve i semilavorati dall'hub e li personalizza. Accanto c'è il piccolo deposito del materiale proprio.","spoke.perTe":"Semilavorato + dati tuoi = prodotto su misura: parti da dati certificati, aggiungi i tuoi fogli di calcolo e costruisci i report che ti servono.","spoke.gestoreTesto":"I report e i dati locali sono della funzione. Il dato di base, dentro il semilavorato, resta del team dati: per questo è uguale per tutti.","spokes.0.nome":"Finance","spokes.1.nome":"Commerciale","spokes.2.nome":"HR","spokes.3.nome":"Operations","spokes.4.nome":"Marketing","team.trasporto.nome":"Team dati — trasporto","team.trasporto.fabbrica":"Uno fa scorrere bene il materiale dai fornitori al lago, controllando scivoli e scialuppe; l'altro lo pesca dal lago e lo porta nel magazzino materie prime.","team.trasporto.perTe":"Sono le persone che collegano i tuoi sistemi alla fabbrica e controllano che i carichi arrivino ogni giorno.","team.trasporto.compiti.0.nome":"Fa scorrere il materiale: scivoli e scialuppe","team.trasporto.compiti.1.nome":"Pesca dal lago e porta nel magazzino","team.rotazione.nome":"Team dati — governo, coordinamento e report","team.rotazione.fabbrica":"Si alternano tra tre postazioni: la cabina di controllo (governo della fabbrica), il coordinamento degli operatori e lo showroom, dove nascono i report ufficiali.","team.rotazione.perTe":"Sono poche persone che fanno più mestieri: per questo le richieste si mettono in fila e si pianificano.","team.rotazione.postazioni.0.nome":"Cabina di controllo","team.rotazione.postazioni.1.nome":"Ufficio di coordinamento","team.rotazione.postazioni.2.nome":"Showroom"};
