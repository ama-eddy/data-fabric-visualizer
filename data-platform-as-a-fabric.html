ttono in fila le richieste e si decide cosa viene prima.","workloads.PMO.perTe":"Quando chiedi qualcosa, è qui che la richiesta trova posto nel piano di lavoro, un responsabile e una data.","workloads.ACC.nome":"Accessi","workloads.ACC.tecnico":"Microsoft Entra ID · ruoli di workspace · permessi sugli item","workloads.ACC.fabbrica":"Cancelli, tornelli e badge: si entra solo se autorizzati, e ognuno va solo nei reparti che gli servono.","workloads.ACC.perTe":"Decidi tu chi della tua funzione entra e cosa può fare. Chiedere un accesso è come chiedere un badge.","workloads.SEC.nome":"Security","workloads.SEC.tecnico":"RLS / OLS · sensitivity label · OneLake security","workloads.SEC.fabbrica":"Recinzione, telecamere, caveau e sigilli sui pacchi: proteggono il materiale prezioso.","workloads.SEC.perTe":"I dati riservati li vede solo chi deve: le regole su chi vede cosa viaggiano insieme al dato, anche dentro i tuoi report.","workloads.SRC.nome":"Data Sources","workloads.SRC.tecnico":"Sistemi sorgente · on-premises data gateway","workloads.SRC.fabbrica":"L'area dei fornitori: i sistemi dell'azienda da cui parte il materiale grezzo. Ogni tipo di software ha un edificio diverso, e si possono accendere uno alla volta.","workloads.SRC.perTe":"Sono i sistemi che usi ogni giorno: gestionale, CRM, fogli di calcolo. Esistono anche senza la fabbrica, e tu continui a lavorare lì.","workloads.INT.nome":"Data Integration","workloads.INT.tecnico":"Data Factory: Data pipeline, Copy job, Dataflow Gen2, Shortcut","workloads.INT.fabbrica":"I fornitori fanno arrivare il materiale nel lago dei dati con scivoli e scialuppe; il team dati lo pesca e lo porta nel magazzino materie prime (Bronze), dove viene conservato così com'è.","workloads.INT.perTe":"I dati dei sistemi che usi ogni giorno arrivano qui da soli, a orari stabiliti: nessuno deve più estrarli a mano.","workloads.TRF.nome":"Data Transformation","workloads.TRF.tecnico":"Warehouse Silver e Gold · Semantic model","workloads.TRF.fabbrica":"Il materiale viene pulito e controllato (Silver), assemblato in componenti (Gold) e confezionato in semilavorati con il marchio di qualità.","workloads.TRF.perTe":"Ricevi dati già puliti e con i calcoli già pronti: non devi più sistemarli a mano prima di usarli.","workloads.VIS.nome":"Data Visualization","workloads.VIS.tecnico":"Power BI: report e app istituzionali","workloads.VIS.fabbrica":"Lo showroom: i prodotti finiti ufficiali dell'azienda, uguali per tutti.","workloads.VIS.perTe":"Sono i report ufficiali, in Power BI: gli stessi numeri per tutta l'azienda, da consultare senza costruire nulla.","workloads.SSR.nome":"Self-service (spoke)","workloads.SSR.tecnico":"Workspace di dominio · report self-service · composite model","workloads.SSR.fabbrica":"I negozi delle funzioni: ricevono i semilavorati e li personalizzano, aggiungendo se serve il proprio materiale.","workloads.SSR.perTe":"È il tuo negozio: parti da dati certificati e costruisci i report che servono alla tua funzione, senza aspettare nessuno.","workloads.GOV.nome":"Data Governance","workloads.GOV.tecnico":"Microsoft Purview · domini · endorsement · Monitoring hub","workloads.GOV.fabbrica":"La torre di controllo e la sala controllo: fissano le regole comuni, sorvegliano che ogni reparto lavori e mettono il marchio di qualità sui prodotti controllati. Qui c'è anche lo sportello a cui rivolgersi.","workloads.GOV.perTe":"Quando vedi il marchio \"dato certificato\" sai che quel numero è lo stesso per tutti. Se un caricamento salta, il team dati lo sa prima di te. E sai sempre a chi chiedere.","workloads.FIN.nome":"Monitoraggio costi","workloads.FIN.tecnico":"Capacity Metrics app · chargeback","workloads.FIN.fabbrica":"I contatori della centrale: misurano quanta energia consuma ogni reparto e ogni negozio.","workloads.FIN.perTe":"La fabbrica ha un costo, e si può vedere quanto consuma ogni funzione: aiuta a decidere dove investire.","workloads.RTI.nome":"Real-Time","workloads.RTI.tecnico":"Real-Time Intelligence: Eventstream, Eventhouse, Activator","workloads.RTI.fabbrica":"La sala sensori: lavora il materiale in diretta, nel momento in cui arriva, senza passare dal magazzino.","workloads.RTI.perTe":"Serve quando non puoi aspettare domani: vedere cosa succede adesso e ricevere un avviso appena qualcosa cambia.","workloads.KNW.nome":"Knowledge","workloads.KNW.tecnico":"Ontology (Fabric IQ)","workloads.KNW.fabbrica":"L'ufficio tecnico e l'archivio dei progetti: la mappa di cosa sono le cose dell'azienda e di come sono collegate.","workloads.KNW.perTe":"Mette tutti d'accordo sul significato delle parole (\"cliente\", \"ordine\", \"margine\") e permette di fare domande ai dati nel linguaggio di tutti i giorni.","elements.capannone.nome":"Capannone dell'hub","elements.capannone.tecnico":"Tenant · workspace dell'hub","elements.capannone.fabbrica":"Fondamenta, pavimento e struttura del capannone. Dentro prenderanno posto i reparti.","elements.capannone.perTe":"È lo spazio comune, già pronto: quando la tua funzione avrà bisogno di qualcosa, non si parte dal terreno vuoto.","elements.lago.nome":"Lago dei dati","elements.lago.tecnico":"OneLake (Landing: file in un Lakehouse)","elements.lago.fabbrica":"Il lago dei dati: un'unica riserva tra i fornitori e la fabbrica. Il materiale di tutti i fornitori arriva qui così com'è, prima di essere pescato e portato nel magazzino.","elements.lago.perTe":"Un solo posto dove arrivano i dati di tutti i sistemi: niente copie sparse, e si può sempre tornare a vedere il dato com'era all'origine.","elements.centrale.nome":"Centrale elettrica","elements.centrale.tecnico":"Fabric capacity","elements.centrale.fabbrica":"La centrale dà energia a tutti i reparti. Se un reparto ne consuma troppa, gli altri rallentano.","elements.centrale.perTe":"L'energia della fabbrica ha un costo ed è condivisa: per questo si pianifica chi consuma cosa.","elements.laboratorio.nome":"Laboratorio prove","elements.laboratorio.tecnico":"Workspace Dev e Test · deployment pipeline","elements.laboratorio.fabbrica":"Il laboratorio prove: ogni semilavorato viene collaudato qui prima di uscire dalla fabbrica, e ogni modifica si prova qui prima di entrare in produzione.","elements.laboratorio.perTe":"Quello che ricevi è già stato provato. E quando chiedi una modifica, la provi insieme al team dati prima che arrivi a tutti: niente sorprese nei report.","elements.fornitori.nome":"Area fornitori","elements.fornitori.tecnico":"Sistemi sorgente","elements.fornitori.fabbrica":"L'area dei fornitori: i sistemi dell'azienda da cui parte il materiale grezzo. Ogni tipo di fornitore ha un edificio diverso.","elements.fornitori.perTe":"Sono i sistemi che usi ogni giorno: gestionale, CRM, fogli di calcolo. Tu continui a lavorare lì, il materiale parte da solo.","elements.pontile.nome":"Pontile di pesca","elements.pontile.tecnico":"Data pipeline di caricamento nel Bronze","elements.pontile.fabbrica":"Il pontile sulla riva del lago: da un pannello di comando il team dati manovra le gru, che pescano il materiale arrivato dai fornitori e lo mettono sui nastri verso il magazzino materie prime.","elements.pontile.perTe":"È il passaggio dal \"dato arrivato\" al \"dato conservato\": da qui in poi il materiale è in fabbrica, etichettato e pronto per la lavorazione.","elements.bronze.nome":"Magazzino materie prime (Bronze)","elements.bronze.tecnico":"Warehouse Bronze","elements.bronze.fabbrica":"Il magazzino materie prime: il materiale viene messo a scaffale con l'etichetta di arrivo e conservato, ancora grezzo.","elements.bronze.perTe":"Tutto ciò che arriva resta conservato con la sua data: si può sempre tornare a vedere com'era il dato in origine.","elements.silver.nome":"Reparto lavorazione (Silver)","elements.silver.tecnico":"Warehouse Silver","elements.silver.fabbrica":"Il reparto lavorazione: il materiale viene pulito, controllato e portato a misura. Qui nasce la qualità.","elements.silver.perTe":"Doppioni, errori di battitura, codici diversi per la stessa cosa: vengono sistemati qui, una volta per tutti.","elements.gold.nome":"Linea di assemblaggio (Gold)","elements.gold.tecnico":"Warehouse Gold (modello a stella)","elements.gold.fabbrica":"La linea di assemblaggio: i pezzi puliti vengono montati in componenti pensati per il business (vendite, clienti, costi).","elements.gold.perTe":"I dati di sistemi diversi vengono messi insieme: finalmente il cliente del CRM e quello del gestionale sono la stessa cosa.","elements.confezionamento.nome":"Confezionamento semilavorati","elements.confezionamento.tecnico":"Semantic model","elements.confezionamento.fabbrica":"Il confezionamento: i componenti diventano semilavorati, con le istruzioni dentro e il marchio di qualità sopra.","elements.confezionamento.perTe":"Il semilavorato è un dato certificato, con i calcoli già pronti: lo stesso per tutti, pronto per costruirci i report.","elements.spedizioni.nome":"Spedizioni","elements.spedizioni.tecnico":"Condivisione dei Semantic model (permesso Build)","elements.spedizioni.fabbrica":"Il reparto spedizioni: da qui i semilavorati collaudati partono verso i negozi delle funzioni.","elements.spedizioni.perTe":"È da qui che i dati certificati arrivano alla tua funzione.","elements.showroom.nome":"Showroom","elements.showroom.tecnico":"Report e app Power BI","elements.showroom.fabbrica":"Lo showroom dell'hub, appena fuori dalla fabbrica e aperto a chi entra dall'ingresso clienti: i prodotti finiti ufficiali, costruiti dal team dati sui semilavorati collaudati e uguali per tutta l'azienda.","elements.showroom.perTe":"Sono i report ufficiali, in Power BI: li apri e leggi il numero, senza costruire nulla. È lo stesso numero che vedono tutti.","elements.coordinamento.nome":"Ufficio di coordinamento","elements.coordinamento.tecnico":"Project management del team dati","elements.coordinamento.fabbrica":"L'ufficio da cui si coordinano tutti gli operatori della fabbrica: chi fa cosa, in che ordine, entro quando.","elements.coordinamento.perTe":"Quando chiedi qualcosa, è qui che la richiesta trova posto nel piano di lavoro e un responsabile.","elements.cancelli.nome":"Cancelli e tornelli","elements.cancelli.tecnico":"Microsoft Entra ID · ruoli e permessi","elements.cancelli.fabbrica":"Il cancello della fabbrica, con i tornelli e il lettore di badge: oltre questo punto va solo il team dati, e ognuno raggiunge solo i reparti che gli servono. Da qui escono i semilavorati verso i negozi.","elements.cancelli.perTe":"Per far entrare una persona della tua funzione si chiede un badge: decidi tu chi entra e che cosa può fare.","elements.ingresso.nome":"Ingresso clienti","elements.ingresso.tecnico":"Accesso con l'account aziendale (Microsoft Entra ID)","elements.ingresso.fabbrica":"L'ingresso clienti: chi fa parte dell'azienda passa il badge ai tornelli e raggiunge lo showroom e i negozi. Nel capannone, oltre il cancello della fabbrica, lavora il team dati.","elements.ingresso.perTe":"Entri con il tuo account aziendale: guardi i report ufficiali nello showroom e quelli della tua funzione nel tuo negozio. Non ti serve entrare in fabbrica.","elements.recinzione.nome":"Recinzione e telecamere","elements.recinzione.tecnico":"Sicurezza di rete · audit degli accessi","elements.recinzione.fabbrica":"La recinzione, con le telecamere: un solo perimetro racchiude fabbrica, showroom e negozi, e tiene fuori chi non è dell'azienda. Si entra dall'ingresso clienti, e chi passa viene registrato.","elements.recinzione.perTe":"I dati della tua funzione sono protetti come quelli di tutte le altre: si sa sempre chi ha guardato cosa.","elements.caveau.nome":"Caveau","elements.caveau.tecnico":"RLS / OLS · sensitivity label","elements.caveau.fabbrica":"Il caveau: il materiale più delicato sta qui, sotto chiave.","elements.caveau.perTe":"I dati riservati (stipendi, dati personali) li vede solo chi deve: le regole su chi vede cosa valgono anche dentro i tuoi report.","elements.torre.nome":"Torre di controllo","elements.torre.tecnico":"Microsoft Purview · domini · endorsement (certificazione)","elements.torre.fabbrica":"La torre di controllo: da qui si governa la fabbrica, si fissano le regole comuni e si mette il marchio di qualità sui prodotti controllati.","elements.torre.perTe":"Il marchio \"dato certificato\" nasce qui: quando lo vedi, quel numero è lo stesso per tutta l'azienda.","elements.sportello.nome":"Sportello dell'hub","elements.sportello.tecnico":"Center of Excellence (CoE)","elements.sportello.fabbrica":"Lo sportello dell'hub: il punto in cui le funzioni incontrano il team dati per chiedere, segnalare un problema o aprire il proprio negozio.","elements.sportello.perTe":"Non devi sapere a quale reparto rivolgerti: vieni qui, e la tua richiesta arriva alla persona giusta.","elements.salacontrollo.nome":"Sala controllo","elements.salacontrollo.tecnico":"Monitoring hub · alert","elements.salacontrollo.fabbrica":"La sala controllo: una spia per ogni reparto. Verde se lavora, gialla se è in costruzione, rossa se è fermo.","elements.salacontrollo.perTe":"Se un caricamento salta, il team dati lo vede qui prima che tu apra il report: spesso il problema è già risolto quando arrivi.","elements.contatori.nome":"Contatori della centrale","elements.contatori.tecnico":"Capacity Metrics app","elements.contatori.fabbrica":"I contatori della centrale: più reparti lavorano, più energia si consuma. Qui si vede quanto consuma ciascuno.","elements.contatori.perTe":"Anche il tuo negozio ha il suo contatore: sapere quanto consuma aiuta a decidere dove vale la pena investire.","elements.sensori.nome":"Sala sensori","elements.sensori.tecnico":"Eventstream · Eventhouse · Activator","elements.sensori.fabbrica":"La sala sensori: il materiale dei sensori arriva sul nastro veloce e viene guardato subito, sul grande schermo, senza passare dal lago e dal magazzino.","elements.sensori.perTe":"Vedi cosa sta succedendo in questo momento, e puoi farti avvisare appena un valore esce dalla norma.","elements.archivio.nome":"Ufficio tecnico e archivio","elements.archivio.tecnico":"Ontology (Fabric IQ)","elements.archivio.fabbrica":"L'ufficio tecnico: sul tetto, la mappa di come le cose dell'azienda sono collegate tra loro. I fili d'oro la legano alla linea di assemblaggio e ai semilavorati.","elements.archivio.perTe":"Cliente, ordine, margine: qui si scrive una volta per tutte cosa significano, così tutti parlano la stessa lingua e si possono fare domande ai dati con parole semplici.","materiali.grezzo.nome":"Grezzo","materiali.grezzo.tecnico":"Dati grezzi (file in OneLake)","materiali.bronze.nome":"Bronze — conservato","materiali.bronze.tecnico":"Layer Bronze","materiali.silver.nome":"Silver — pulito","materiali.silver.tecnico":"Layer Silver","materiali.gold.nome":"Gold — assemblato","materiali.gold.tecnico":"Layer Gold","materiali.semilavorato.nome":"Semilavorato certificato","materiali.semilavorato.tecnico":"Semantic model certificato","materiali.report.nome":"Report — prodotto finito","materiali.report.tecnico":"Report Power BI","modalita.copy.nome":"Scivolo","modalita.copy.tecnico":"Data pipeline / Copy job","modalita.copy.testo":"A orari stabiliti il materiale scivola dal fornitore nel lago dei dati; da lì il team dati lo pesca e lo porta nel magazzino.","modalita.dataflow.nome":"Scialuppa","modalita.dataflow.tecnico":"Dataflow Gen2","modalita.dataflow.testo":"Il materiale scende su una scialuppa che lo sistema un po' già durante il viaggio, attraversa il lago e lo lascia al pontile.","modalita.mirroring.nome":"Scivolo di vetro","modalita.mirroring.tecnico":"Mirroring","modalita.mirroring.testo":"Una copia sempre aggiornata: il materiale scende senza sosta nel lago da uno scivolo di vetro, appena cambia nel sistema d'origine.","modalita.shortcut.nome":"Ponte di vetro","modalita.shortcut.tecnico":"Shortcut di OneLake","modalita.shortcut.testo":"Il materiale non si sposta: resta dal fornitore, e attraverso un ponte di vetro compare nel lago senza essere copiato. Da lì il team dati lo recupera come il resto.","modalita.streaming.nome":"Nastro veloce","modalita.streaming.tecnico":"Eventstream","modalita.streaming.testo":"Il materiale arriva in diretta, un pezzo dopo l'altro, alla sala sensori: funziona solo quando il Real-Time è attivo.","categorie.erp.nome":"ERP","categorie.erp.tecnico":"Enterprise Resource Planning","categorie.erp.fabbrica":"Un grande stabilimento: il fornitore principale, con tanto materiale ben organizzato.","categorie.erp.perTe":"È il gestionale: ordini, fatture, contabilità, acquisti.","categorie.crm.nome":"CRM","categorie.crm.tecnico":"Customer Relationship Management","categorie.crm.fabbrica":"Un'agenzia commerciale: qui nasce tutto ciò che riguarda il rapporto con i clienti.","categorie.crm.perTe":"È il sistema dove si seguono clienti, contatti, offerte e trattative.","categorie.pim.nome":"PIM","categorie.pim.tecnico":"Product Information Management","categorie.pim.fabbrica":"La sala cataloghi: schede ordinate di ogni prodotto, con codici, descrizioni e immagini.","categorie.pim.perTe":"È il sistema che tiene le informazioni sui prodotti: codici, caratteristiche, descrizioni, listini.","categorie.hr.nome":"HR","categorie.hr.tecnico":"Human Resources","categorie.hr.fabbrica":"Una palazzina di uffici: le informazioni sulle persone dell'azienda.","categorie.hr.perTe":"È il sistema del personale: organico, presenze, paghe. Sono dati delicati, protetti dalle regole su chi vede cosa.","categorie.mes.nome":"Produzione e magazzino","categorie.mes.tecnico":"MES / WMS","categorie.mes.fabbrica":"Dei silos: materiale già stoccato in modo ordinato, pronto da prelevare.","categorie.mes.perTe":"Sono i sistemi della produzione e del magazzino: giacenze, lotti, avanzamento degli ordini.","categorie.ecommerce.nome":"E-commerce","categorie.ecommerce.tecnico":"B2B / B2C","categorie.ecommerce.fabbrica":"Un centro pacchi: ordini che arrivano dal negozio online, uno dopo l'altro.","categorie.ecommerce.perTe":"È il negozio online: ordini, carrelli, resi, comportamento dei clienti sul sito.","categorie.marketing.nome":"Marketing","categorie.marketing.tecnico":"Marketing automation","categorie.marketing.fabbrica":"Uno sportello: si chiede e si riceve, un pezzo alla volta.","categorie.marketing.perTe":"Sono i servizi di marketing a cui l'azienda è abbonata: campagne, newsletter, social.","categorie.excel.nome":"Fogli di calcolo","categorie.excel.tecnico":"Excel / CSV","categorie.excel.fabbrica":"Un archivio di scatoloni: materiale sfuso, preparato a mano.","categorie.excel.perTe":"Sono i fogli di calcolo che oggi qualcuno compila e si passa a mano: budget, previsioni, tabelle di appoggio.","categorie.iot.nome":"Sensori","categorie.iot.tecnico":"IoT","categorie.iot.fabbrica":"Un campo di sensori: il materiale arriva in continuazione, senza pause.","categorie.iot.perTe":"Sono macchine e sensori che mandano segnali in ogni momento.","categorie.esterni.nome":"Dati esterni","categorie.esterni.tecnico":"Open data","categorie.esterni.fabbrica":"Un mercato: materiale che viene da fuori, acquistato o pubblico.","categorie.esterni.perTe":"Sono dati di mercato o dati pubblici che arricchiscono quelli dell'azienda.","categorie.datalake.nome":"Data lake esistente","categorie.datalake.tecnico":"ADLS, S3","categorie.datalake.fabbrica":"Un deposito di container: grandi quantità di materiale già raccolto altrove.","categorie.datalake.perTe":"È un archivio dati che l'azienda ha già: si usa così com'è, senza duplicarlo.","sources.src-erp.nome":"Gestionale","sources.src-crm.nome":"CRM","sources.src-pim.nome":"Anagrafica prodotti","sources.src-hr.nome":"Sistema del personale","sources.src-mes.nome":"Produzione e magazzino","sources.src-ecom.nome":"Negozio online","sources.src-mkt.nome":"Marketing","sources.src-excel.nome":"Budget e forecast (Excel)","sources.src-iot.nome":"Sensori di impianto","sources.src-ext.nome":"Dati di mercato","sources.src-lake.nome":"Archivio dati esistente","spoke.fabbrica":"Il negozio della funzione: riceve i semilavorati dalla fabbrica e ne fa prodotti su misura per i propri clienti, che mette in vetrina. Sul retro c'è il piccolo deposito del materiale proprio.","spoke.perTe":"Semilavorato + dati tuoi = prodotto su misura: parti da dati certificati, aggiungi i tuoi fogli di calcolo e metti in vetrina i report che servono alla tua funzione.","spoke.gestoreTesto":"I report e i dati locali sono della funzione. Il dato di base, dentro il semilavorato, resta del team dati: per questo è uguale per tutti.","spoke.tecnico":"Workspace di dominio · composite model","spokes.0.nome":"Finance","spokes.1.nome":"Commerciale","spokes.2.nome":"HR","spokes.3.nome":"Operations","spokes.4.nome":"Marketing","team.nome":"Persona del team dati","team.perTe":"Il team dati è fatto di poche persone, di IT e di business, e ognuna segue più cose: per questo le richieste si mettono in fila e si pianificano.","team.raccolta.nome":"Macchinetta del caffè","team.postazioni.ARC.nome":"Tavolo dei progetti","team.postazioni.ARC.tecnico":"Data architect","team.postazioni.ARC.cosa":"Progetta la fabbrica: dove vanno i reparti, quanta energia serve, come si collegano.","team.postazioni.PMO.nome":"Ufficio di coordinamento","team.postazioni.PMO.tecnico":"Project manager","team.postazioni.PMO.cosa":"Coordina gli operatori: chi fa cosa, in che ordine, entro quando.","team.postazioni.INT.nome":"Scivoli e gru","team.postazioni.INT.tecnico":"Data engineer","team.postazioni.INT.cosa":"Il primo costruisce e ripara gli scivoli; il secondo manovra dal pannello le gru che pescano dal lago e riempiono il magazzino.","team.postazioni.TRF.nome":"Banchi del laboratorio prove","team.postazioni.TRF.tecnico":"Analytics engineer","team.postazioni.TRF.cosa":"Costruisce la lavorazione e collauda i semilavorati prima che escano.","team.postazioni.SEC.nome":"Caveau","team.postazioni.SEC.tecnico":"Responsabile della sicurezza dei dati","team.postazioni.SEC.cosa":"Decide come si protegge il materiale riservato e controlla chi lo ha guardato.","team.postazioni.ACC.nome":"Portineria del cancello","team.postazioni.ACC.tecnico":"Amministratore degli accessi","team.postazioni.ACC.cosa":"Consegna i badge: chi entra e che cosa può fare.","team.postazioni.VIS.nome":"Showroom","team.postazioni.VIS.tecnico":"BI developer","team.postazioni.VIS.cosa":"Costruisce i report ufficiali sui semilavorati collaudati.","team.postazioni.SSR.nome":"In un negozio","team.postazioni.SSR.tecnico":"Analista della funzione","team.postazioni.SSR.cosa":"Costruisce i report della funzione sui semilavorati, con i dati locali.","team.postazioni.GOV.nome":"Cabina della torre di controllo","team.postazioni.GOV.tecnico":"Data steward","team.postazioni.GOV.cosa":"Fissa le regole comuni, sorveglia i reparti e mette il marchio di qualità.","team.postazioni.FIN.nome":"Contatori della centrale","team.postazioni.FIN.tecnico":"Responsabile dei costi","team.postazioni.FIN.cosa":"Legge i consumi e li riporta a ogni reparto e a ogni negozio.","team.postazioni.KNW.nome":"Ufficio tecnico","team.postazioni.KNW.tecnico":"Responsabile del glossario","team.postazioni.KNW.cosa":"Tiene la mappa di cosa significano le parole dell'azienda e di come sono collegate.","team.postazioni.RTI.nome":"Sala sensori","team.postazioni.RTI.tecnico":"Analista dei dati in diretta","team.postazioni.RTI.cosa":"Sorveglia i segnali in arrivo e imposta gli avvisi.","chapters.inizio.titolo":"Il punto di partenza","chapters.inizio.testo":"Oggi ogni funzione lavora nei propri sistemi e i numeri si passano a mano, tra fogli di calcolo e mail. Qui c'è un terreno vuoto: costruiamo insieme la fabbrica dei dati, un pezzo alla volta.","chapters.sorgenti.titolo":"I fornitori: i sistemi che usate ogni giorno","chapters.sorgenti.testo":"Gestionale, CRM, fogli di calcolo: il dato nasce qui, nel lavoro di tutti i giorni. Ogni sistema è un fornitore di materia prima, e resta dov'è: voi continuate a lavorarci come sempre.","chapters.architettura.titolo":"Data Architecture: le fondamenta","chapters.architettura.testo":"Prima si costruisce lo spazio comune: il capannone, la centrale che dà energia e il lago dei dati, un solo posto dove arriverà il materiale di tutti i fornitori.","chapters.coordinamento.titolo":"Project Management: chi fa cosa","chapters.coordinamento.testo":"Il team dati è fatto di poche persone e le richieste sono tante. Dall'ufficio di coordinamento si decide cosa viene prima e si dà a ogni richiesta un responsabile e una data.","chapters.integrazione.titolo":"Data Integration: il materiale arriva in fabbrica","chapters.integrazione.testo":"Dai fornitori il materiale scivola nel lago a orari stabiliti: per questo un dato di oggi può arrivare domani. Il team dati lo pesca e lo mette nel magazzino materie prime, così com'è. Nessuno deve più estrarre dati a mano.","chapters.trasformazione.titolo":"Data Transformation: dal grezzo al semilavorato","chapters.trasformazione.testo":"Il materiale viene pulito, assemblato e confezionato in semilavorati: dati certificati, con i calcoli già pronti. Ogni semilavorato passa dal laboratorio prove prima di uscire dalla fabbrica.","chapters.sicurezza.titolo":"Security: proteggere ciò che vale","chapters.sicurezza.testo":"Recinzione, telecamere e caveau: da fuori non entra nessuno, i dati riservati li vede solo chi deve, e si sa sempre chi ha guardato cosa.","chapters.accessi.titolo":"Accessi: chi entra e cosa può fare","chapters.accessi.testo":"Si entra con il badge. Dall'ingresso clienti chi fa parte dell'azienda raggiunge lo showroom e il proprio negozio; oltre il cancello della fabbrica va solo il team dati. Ogni funzione decide chi dei suoi entra, e ognuno raggiunge solo ciò che gli serve.","chapters.visualizzazione.titolo":"Data Visualization: i report ufficiali","chapters.visualizzazione.testo":"Nello showroom, aperto a tutta l'azienda, nascono i report ufficiali, in Power BI, costruiti sui semilavorati collaudati: gli stessi numeri per tutta l'azienda.","chapters.negozi.titolo":"Self-service: i negozi delle funzioni","chapters.negozi.testo":"Ogni funzione riceve i semilavorati e ci costruisce i propri report, aggiungendo se serve i propri dati. Non si parte da zero e non si aspetta nessuno.","chapters.governance.titolo":"Data Governance: regole, qualità, sportello","chapters.governance.testo":"La torre fissa le regole comuni e mette il marchio di qualità. La sala controllo sorveglia che ogni reparto lavori. Allo sportello si chiede, si segnala un problema, si porta una nuova esigenza.","chapters.costi.titolo":"Monitoraggio costi: quanto consuma la fabbrica","chapters.costi.testo":"La fabbrica ha un costo, e i contatori mostrano quanto consuma ogni reparto e ogni negozio: serve a decidere dove vale la pena investire.","chapters.conoscenza.titolo":"Knowledge: parlare la stessa lingua","chapters.conoscenza.testo":"L'ufficio tecnico tiene la mappa di cosa sono le cose dell'azienda e di come sono collegate: mette tutti d'accordo sul significato delle parole e permette di fare domande ai dati nel linguaggio di tutti i giorni.","chapters.tempo-reale.titolo":"Real-Time: quando non si può aspettare domani","chapters.tempo-reale.testo":"Alcuni segnali vanno visti subito. Il nastro veloce porta il materiale dai sensori alla sala sensori nel momento in cui nasce, senza passare dal lago e dal magazzino.","paths.incidente.sottotitolo":"Incident","paths.incidente.titolo":"Il numero nel mio report è sbagliato","paths.incidente.messaggio":"Non devi sapere dove sta il problema: lo segnali allo sportello e il team dati risale la filiera per te.","paths.incidente.tappe.0.chi":"La funzione","paths.incidente.tappe.0.cosa":"Nel report della funzione un numero non torna, o non si è aggiornato.","paths.incidente.tappe.0.tu":"Ti accorgi del problema e non provi a sistemarlo a mano.","paths.incidente.tappe.1.chi":"La funzione e il team dati","paths.incidente.tappe.1.cosa":"La segnalazione arriva allo sportello dell'hub.","paths.incidente.tappe.1.tu":"Segnali quale report, quale numero e da quando.","paths.incidente.tappe.2.chi":"Il team dati","paths.incidente.tappe.2.cosa":"In sala controllo si guarda se qualche reparto si è fermato: una spia rossa dice già dove cercare.","paths.incidente.tappe.3.chi":"Il team dati","paths.incidente.tappe.3.cosa":"Si controlla il semilavorato: il calcolo è quello giusto?","paths.incidente.tappe.4.chi":"Il team dati","paths.incidente.tappe.4.cosa":"Si risale la filiera, un reparto alla volta: i componenti sono stati assemblati bene?","paths.incidente.tappe.5.chi":"Il team dati","paths.incidente.tappe.5.cosa":"Ancora più a monte: la pulizia ha scartato o corretto qualcosa che non doveva?","paths.incidente.tappe.6.chi":"Il team dati","paths.incidente.tappe.6.cosa":"Nel magazzino si guarda il materiale così com'era arrivato: l'errore c'era già?","paths.incidente.tappe.7.chi":"Il team dati","paths.incidente.tappe.7.cosa":"Si trova la causa: un carico non è arrivato nel lago, oppure il dato era sbagliato già dal fornitore.","paths.incidente.tappe.8.chi":"Il team dati","paths.incidente.tappe.8.cosa":"Corretta la causa, il materiale ripercorre la filiera e il semilavorato viene collaudato di nuovo.","paths.incidente.tappe.9.chi":"La funzione","paths.incidente.tappe.9.cosa":"Il report torna corretto e la funzione viene avvisata.","paths.incidente.tappe.9.tu":"Controlli che il numero ora torni.","paths.richiesta.sottotitolo":"Change request","paths.richiesta.titolo":"Mi serve un nuovo indicatore","paths.richiesta.messaggio":"Quello che serve a tutti entra nel semilavorato; quello che serve solo a te lo costruisci nel tuo negozio.","paths.richiesta.tappe.0.chi":"La funzione","paths.richiesta.tappe.0.cosa":"Alla funzione serve un indicatore nuovo, o un'informazione in più.","paths.richiesta.tappe.0.tu":"Descrivi cosa ti serve e per quale decisione.","paths.richiesta.tappe.1.chi":"Il team dati con la funzione","paths.richiesta.tappe.1.cosa":"Allo sportello si capisce: esiste già? Serve a tutti o solo a questa funzione? Se serve solo a te, lo costruisci nel tuo negozio, con il nostro aiuto.","paths.richiesta.tappe.1.tu":"Porti la richiesta allo sportello.","paths.richiesta.tappe.2.chi":"Il team dati","paths.richiesta.tappe.2.cosa":"La richiesta entra nel piano di lavoro: ha un responsabile e una data.","paths.richiesta.tappe.3.chi":"Il team dati","paths.richiesta.tappe.3.cosa":"Si modifica la lavorazione: il nuovo calcolo entra nei componenti.","paths.richiesta.tappe.4.chi":"Il team dati","paths.richiesta.tappe.4.cosa":"Il semilavorato viene aggiornato con il nuovo indicatore.","paths.richiesta.tappe.5.chi":"Il team dati con la funzione","paths.richiesta.tappe.5.cosa":"In laboratorio la modifica si prova prima che arrivi a tutti.","paths.richiesta.tappe.5.tu":"Provi il nuovo indicatore e confermi che è quello che ti serviva.","paths.richiesta.tappe.6.chi":"Il team dati","paths.richiesta.tappe.6.cosa":"Il semilavorato aggiornato riceve il marchio di qualità.","paths.richiesta.tappe.7.chi":"Il team dati","paths.richiesta.tappe.7.cosa":"Il semilavorato aggiornato parte verso tutti i negozi.","paths.richiesta.tappe.8.chi":"La funzione","paths.richiesta.tappe.8.cosa":"L'indicatore è disponibile: per la tua funzione e per tutte le altre.","paths.richiesta.tappe.8.tu":"Lo usi nei tuoi report.","paths.progetto.sottotitolo":"New project · il viaggio del dato","paths.progetto.titolo":"Vogliamo analizzare un'area nuova","paths.progetto.messaggio":"Ogni numero che leggi ha fatto questo viaggio, con un controllo a ogni reparto: per questo ti puoi fidare. E un'area nuova non è un report nuovo: è una nuova linea della fabbrica, che poi serve a tutti.","paths.progetto.tappe.0.chi":"La funzione","paths.progetto.tappe.0.cosa":"Il dato nasce in un sistema che la funzione usa ogni giorno: è lì il nuovo fornitore da collegare.","paths.progetto.tappe.0.tu":"Indichi il sistema e chi lo conosce bene.","paths.progetto.tappe.1.chi":"Il team dati","paths.progetto.tappe.1.cosa":"Si costruisce lo scivolo: da ora il materiale scende nel lago a orari stabiliti. Per questo un dato di oggi può arrivare domani.","paths.progetto.tappe.2.chi":"Il team dati","paths.progetto.tappe.2.cosa":"Il materiale viene pescato e messo nel magazzino, così com'è, con la data di arrivo.","paths.progetto.tappe.3.chi":"Il team dati","paths.progetto.tappe.3.cosa":"Viene pulito e controllato: qui nasce la qualità.","paths.progetto.tappe.4.chi":"Il team dati con la funzione","paths.progetto.tappe.4.cosa":"Viene assemblato con il materiale degli altri fornitori, secondo le regole della funzione.","paths.progetto.tappe.4.tu":"Spieghi come si calcolano i tuoi numeri.","paths.progetto.tappe.5.chi":"Il team dati","paths.progetto.tappe.5.cosa":"Nasce un nuovo semilavorato, collaudato in laboratorio e certificato.","paths.progetto.tappe.6.chi":"Il team dati","paths.progetto.tappe.6.cosa":"Sul semilavorato nascono i report: il manager legge il numero, e dietro quel numero c'è tutto il viaggio appena visto.","paths.progetto.tappe.6.tu":"Leggi il numero e decidi.","paths.ingresso.sottotitolo":"Onboarding","paths.ingresso.titolo":"Come entra la mia funzione nella fabbrica?","paths.ingresso.messaggio":"Non parti da zero: ricevi semilavorati già controllati e ci costruisci sopra quello che ti serve.","paths.ingresso.tappe.0.chi":"La funzione","paths.ingresso.tappe.0.cosa":"La funzione si presenta allo sportello dell'hub.","paths.ingresso.tappe.0.tu":"Racconti cosa vorresti capire dai tuoi dati.","paths.ingresso.tappe.1.chi":"Il team dati","paths.ingresso.tappe.1.cosa":"L'ingresso della funzione entra nel piano di lavoro.","paths.ingresso.tappe.2.chi":"Il team dati","paths.ingresso.tappe.2.cosa":"Si costruisce il negozio della funzione.","paths.ingresso.tappe.3.chi":"La funzione","paths.ingresso.tappe.3.cosa":"Si distribuiscono i badge per l'ingresso clienti.","paths.ingresso.tappe.3.tu":"Decidi chi dei tuoi entra e cosa può fare.","paths.ingresso.tappe.4.chi":"Il team dati con la funzione","paths.ingresso.tappe.4.cosa":"Si fissano le regole su chi vede cosa.","paths.ingresso.tappe.4.tu":"Indichi quali dati sono riservati.","paths.ingresso.tappe.5.chi":"Il team dati","paths.ingresso.tappe.5.cosa":"Parte il primo semilavorato verso il nuovo negozio.","paths.ingresso.tappe.6.chi":"La funzione","paths.ingresso.tappe.6.cosa":"Nasce il primo report della funzione.","paths.ingresso.tappe.6.tu":"Costruisci il report, con il supporto del team dati.","paths.ingresso.tappe.7.chi":"La funzione","paths.ingresso.tappe.7.cosa":"La funzione vede quanta energia consuma il suo negozio."};
window.TESTI_MD = "# Testi di Data Platform as a Fabric\n\n> **Come si usa.** Ogni testo ha un titolo con la sua chiave (`### chiave`): si cambia **solo il testo sotto il titolo**, mai la chiave.\n> Il testo può andare a capo liberamente: viene unito in un'unica riga. Niente apici o caratteri speciali da rispettare.\n> Si modifica anche da GitHub nel browser (matita in alto a destra): al salvataggio la pagina pubblica si aggiorna da sola in un paio di minuti.\n> **Nome tecnico**: le chiavi che finiscono con `.tecnico` sono la riga \"In Fabric\" della scheda: qui (e solo qui) vanno i termini tecnici.\n> **Lessico** (REQUISITI §1.2): ammessi report, Power BI, dato certificato, Bronze / Silver / Gold. Gli altri termini tecnici (Lakehouse, pipeline, modello semantico…) vanno tradotti: se ne compare uno, la pagina **non** viene aggiornata e l'azione su GitHub diventa rossa indicando dove.\n> Le parole del profilo di un'azienda (nomi degli spoke, delle sorgenti, contatto) non stanno qui: stanno nel profilo.\n\n## Titolo\n\n### meta.titolo\nData Platform as a Fabric\n\n### meta.sottotitolo\nIl percorso dei numeri dalla sorgente al report\n\n## Interfaccia: pulsanti e intestazioni\n\n### ui.workload\nWorkload\n\n### ui.stati.off\nOff\n\n### ui.stati.wip\nIn progress\n\n### ui.stati.on\nOn\n\n### ui.statoLungo.off\nNon presente\n\n### ui.statoLungo.wip\nIn costruzione\n\n### ui.statoLungo.on\nAttivo\n\n### ui.vistaInsieme\nVista d'insieme\n\n### ui.etichette\nEtichette\n\n### ui.pausa\nPausa flussi\n\n### ui.riprendi\nRiprendi flussi\n\n### ui.tuttoOn\nTutto on\n\n### ui.tuttoOff\nTutto off\n\n### ui.modificaTesti\nModifica testi\n\n### ui.fineModifica\nFine modifica\n\n### ui.esportaTesti\nEsporta testi\n\n### ui.annullaTesti\nAnnulla modifiche\n\n### ui.annullaTestiConferma\nTornare ai testi pubblicati? Le modifiche non esportate andranno perse.\n\n### ui.caricaProfilo\nCarica profilo\n\n### ui.togliProfilo\nTogli profilo\n\n### ui.profiloErrato\nIl file scelto non è un profilo valido: deve essere un file JSON con la forma del profilo di esempio.\n\n### ui.nellaFabbrica\nNella fabbrica\n\n### ui.perTe\nCosa significa per te\n\n### ui.contatto\nA chi rivolgerti\n\n### ui.gestore\nChi lo gestisce\n\n### ui.gestori.hub\nIl team dati (hub)\n\n### ui.gestori.spoke\nLa tua funzione (spoke)\n\n### ui.gestori.entrambi\nIl team dati insieme alla tua funzione\n\n### ui.lavori\nLavori in corso\n\n### ui.segnaposto\nin arrivo\n\n### ui.aiuto\nTrascina per ruotare · rotellina per lo zoom · tasto destro o WASD per spostarti · clic su un elemento per la scheda\n\n### ui.chiudi\nChiudi\n\n### ui.tecnico\nIn Fabric\n\n### ui.presentazione\nPresentazione\n\n### ui.percorsi\nPercorsi\n\n### ui.avanti\nAvanti\n\n### ui.indietro\nIndietro\n\n### ui.esci\nEsci\n\n### ui.tornaQui\nTorna qui\n\n### ui.capitolo\nCapitolo\n\n### ui.tappa\nTappa\n\n### ui.di\ndi\n\n### ui.chi\nChi\n\n### ui.tu\nCosa fai tu\n\n### ui.ricorda\nDa ricordare\n\n### ui.nessunaTappa\nQuesto percorso attraversa reparti non ancora accesi.\n\n### ui.aiutoGuida\nAvanti: → o spazio · Indietro: ← · Esci: Esc\n\n### ui.aggiungiUomo\nAggiungi una persona (uomo)\n\n### ui.aggiungiDonna\nAggiungi una persona (donna)\n\n### ui.togli\nTogli la persona selezionata, o l'ultima\n\n### ui.azzera\nAzzera\n\n### ui.azzeraTitolo\nTorna al team di partenza\n\n### ui.ruolo\nRuolo\n\n### ui.compiti\nDi cosa si occupa\n\n### ui.assegna\nAssegna a\n\n### ui.trascina\nTrascina una persona su un workload per assegnarla\n\n### ui.teamVuoto\nAggiungi le persone con +\n\n### ui.senzaCompito\nNon ha ancora un compito: aspetta alla macchinetta del caffè.\n\n### ui.scoperto\nNessuno se ne occupa\n\n### ui.inAttesa\nin attesa: workload spento\n\n### ui.benvenutoTitolo\nLa fabbrica dei dati\n\n### ui.esplora\nEsplora liberamente\n\n### ui.menu\nPannello\n\n### ui.benvenuto1\nI numeri che leggi nei report non nascono nei report: nascono nei sistemi che usi ogni giorno e fanno un viaggio, come in una fabbrica.\n\n### ui.benvenuto2\nQui vedi quel viaggio: i fornitori, il lago dove arriva il materiale, i reparti che lo lavorano, i semilavorati certificati e i negozi delle funzioni.\n\n### ui.benvenuto3\nPuoi seguire la presentazione, un capitolo alla volta, oppure esplorare da solo: accendi i reparti dal pannello e clicca su ciò che vedi.\n\n### ui.mezzo\nCome arriva il materiale\n\n### ui.statoElemento\nStato\n\n### ui.categoria\nTipo di sistema\n\n### ui.apri\nMostra uno per uno\n\n### ui.team\nTeam dati\n\n### ui.fuoriServizio\nnon in servizio\n\n## Contatto predefinito (\"A chi rivolgerti\")\n\n### contatto.chi\nLo sportello dell'hub\n\n### contatto.come\nIl punto di contatto del team dati\n\n## Workload: schede\n\n### workloads.ARC.nome\nData Architecture\n\n### workloads.ARC.tecnico\nFabric capacity · OneLake · workspace\n\n### workloads.ARC.fabbrica\nIl terreno, le fondamenta e il capannone: lo spazio in cui tutto il resto viene costruito, con la centrale che dà energia e il lago dei dati, unico, tra i fornitori e la fabbrica.\n\n### workloads.ARC.perTe\nÈ la base comune: un solo posto per i dati di tutta l'azienda, invece di tanti archivi sparsi. Senza questa base, ogni funzione ricomincia da zero.\n\n### workloads.PMO.nome\nProject Management\n\n### workloads.PMO.tecnico\nCoordinamento del team dati: pianificazione e priorità\n\n### workloads.PMO.fabbrica\nL'ufficio di coordinamento: da qui si coordinano tutti gli operatori della fabbrica, si mettono in fila le richieste e si decide cosa viene prima.\n\n### workloads.PMO.perTe\nQuando chiedi qualcosa, è qui che la richiesta trova posto nel piano di lavoro, un responsabile e una data.\n\n### workloads.ACC.nome\nAccessi\n\n### workloads.ACC.tecnico\nMicrosoft Entra ID · ruoli di workspace · permessi sugli item\n\n### workloads.ACC.fabbrica\nCancelli, tornelli e badge: si entra solo se autorizzati, e ognuno va solo nei reparti che gli servono.\n\n### workloads.ACC.perTe\nDecidi tu chi della tua funzione entra e cosa può fare. Chiedere un accesso è come chiedere un badge.\n\n### workloads.SEC.nome\nSecurity\n\n### workloads.SEC.tecnico\nRLS / OLS · sensitivity label · OneLake security\n\n### workloads.SEC.fabbrica\nRecinzione, telecamere, caveau e sigilli sui pacchi: proteggono il materiale prezioso.\n\n### workloads.SEC.perTe\nI dati riservati li vede solo chi deve: le regole su chi vede cosa viaggiano insieme al dato, anche dentro i tuoi report.\n\n### workloads.SRC.nome\nData Sources\n\n### workloads.SRC.tecnico\nSistemi sorgente · on-premises data gateway\n\n### workloads.SRC.fabbrica\nL'area dei fornitori: i sistemi dell'azienda da cui parte il materiale grezzo. Ogni tipo di software ha un edificio diverso, e si possono accendere uno alla volta.\n\n### workloads.SRC.perTe\nSono i sistemi che usi ogni giorno: gestionale, CRM, fogli di calcolo. Esistono anche senza la fabbrica, e tu continui a lavorare lì.\n\n### workloads.INT.nome\nData Integration\n\n### workloads.INT.tecnico\nData Factory: Data pipeline, Copy job, Dataflow Gen2, Shortcut\n\n### workloads.INT.fabbrica\nI fornitori fanno arrivare il materiale nel lago dei dati con scivoli e scialuppe; il team dati lo pesca e lo porta nel magazzino materie prime (Bronze), dove viene conservato così com'è.\n\n### workloads.INT.perTe\nI dati dei sistemi che usi ogni giorno arrivano qui da soli, a orari stabiliti: nessuno deve più estrarli a mano.\n\n### workloads.TRF.nome\nData Transformation\n\n### workloads.TRF.tecnico\nWarehouse Silver e Gold · Semantic model\n\n### workloads.TRF.fabbrica\nIl materiale viene pulito e controllato (Silver), assemblato in componenti (Gold) e confezionato in semilavorati con il marchio di qualità.\n\n### workloads.TRF.perTe\nRicevi dati già puliti e con i calcoli già pronti: non devi più sistemarli a mano prima di usarli.\n\n### workloads.VIS.nome\nData Visualization\n\n### workloads.VIS.tecnico\nPower BI: report e app istituzionali\n\n### workloads.VIS.fabbrica\nLo showroom: i prodotti finiti ufficiali dell'azienda, uguali per tutti.\n\n### workloads.VIS.perTe\nSono i report ufficiali, in Power BI: gli stessi numeri per tutta l'azienda, da consultare senza costruire nulla.\n\n### workloads.SSR.nome\nSelf-service (spoke)\n\n### workloads.SSR.tecnico\nWorkspace di dominio · report self-service · composite model\n\n### workloads.SSR.fabbrica\nI negozi delle funzioni: ricevono i semilavorati e li personalizzano, aggiungendo se serve il proprio materiale.\n\n### workloads.SSR.perTe\nÈ il tuo negozio: parti da dati certificati e costruisci i report che servono alla tua funzione, senza aspettare nessuno.\n\n### workloads.GOV.nome\nData Governance\n\n### workloads.GOV.tecnico\nMicrosoft Purview · domini · endorsement · Monitoring hub\n\n### workloads.GOV.fabbrica\nLa torre di controllo e la sala controllo: fissano le regole comuni, sorvegliano che ogni reparto lavori e mettono il marchio di qualità sui prodotti controllati. Qui c'è anche lo sportello a cui rivolgersi.\n\n### workloads.GOV.perTe\nQuando vedi il marchio \"dato certificato\" sai che quel numero è lo stesso per tutti. Se un caricamento salta, il team dati lo sa prima di te. E sai sempre a chi chiedere.\n\n### workloads.FIN.nome\nMonitoraggio costi\n\n### workloads.FIN.tecnico\nCapacity Metrics app · chargeback\n\n### workloads.FIN.fabbrica\nI contatori della centrale: misurano quanta energia consuma ogni reparto e ogni negozio.\n\n### workloads.FIN.perTe\nLa fabbrica ha un costo, e si può vedere quanto consuma ogni funzione: aiuta a decidere dove investire.\n\n### workloads.RTI.nome\nReal-Time\n\n### workloads.RTI.tecnico\nReal-Time Intelligence: Eventstream, Eventhouse, Activator\n\n### workloads.RTI.fabbrica\nLa sala sensori: lavora il materiale in diretta, nel momento in cui arriva, senza passare dal magazzino.\n\n### workloads.RTI.perTe\nServe quando non puoi aspettare domani: vedere cosa succede adesso e ricevere un avviso appena qualcosa cambia.\n\n### workloads.KNW.nome\nKnowledge\n\n### workloads.KNW.tecnico\nOntology (Fabric IQ)\n\n### workloads.KNW.fabbrica\nL'ufficio tecnico e l'archivio dei progetti: la mappa di cosa sono le cose dell'azienda e di come sono collegate.\n\n### workloads.KNW.perTe\nMette tutti d'accordo sul significato delle parole (\"cliente\", \"ordine\", \"margine\") e permette di fare domande ai dati nel linguaggio di tutti i giorni.\n\n## Elementi della scena: etichette e schede\n\n### elements.capannone.nome\nCapannone dell'hub\n\n### elements.capannone.tecnico\nTenant · workspace dell'hub\n\n### elements.capannone.fabbrica\nFondamenta, pavimento e struttura del capannone. Dentro prenderanno posto i reparti.\n\n### elements.capannone.perTe\nÈ lo spazio comune, già pronto: quando la tua funzione avrà bisogno di qualcosa, non si parte dal terreno vuoto.\n\n### elements.lago.nome\nLago dei dati\n\n### elements.lago.tecnico\nOneLake (Landing: file in un Lakehouse)\n\n### elements.lago.fabbrica\nIl lago dei dati: un'unica riserva tra i fornitori e la fabbrica. Il materiale di tutti i fornitori arriva qui così com'è, prima di essere pescato e portato nel magazzino.\n\n### elements.lago.perTe\nUn solo posto dove arrivano i dati di tutti i sistemi: niente copie sparse, e si può sempre tornare a vedere il dato com'era all'origine.\n\n### elements.centrale.nome\nCentrale elettrica\n\n### elements.centrale.tecnico\nFabric capacity\n\n### elements.centrale.fabbrica\nLa centrale dà energia a tutti i reparti. Se un reparto ne consuma troppa, gli altri rallentano.\n\n### elements.centrale.perTe\nL'energia della fabbrica ha un costo ed è condivisa: per questo si pianifica chi consuma cosa.\n\n### elements.laboratorio.nome\nLaboratorio prove\n\n### elements.laboratorio.tecnico\nWorkspace Dev e Test · deployment pipeline\n\n### elements.laboratorio.fabbrica\nIl laboratorio prove: ogni semilavorato viene collaudato qui prima di uscire dalla fabbrica, e ogni modifica si prova qui prima di entrare in produzione.\n\n### elements.laboratorio.perTe\nQuello che ricevi è già stato provato. E quando chiedi una modifica, la provi insieme al team dati prima che arrivi a tutti: niente sorprese nei report.\n\n### elements.fornitori.nome\nArea fornitori\n\n### elements.fornitori.tecnico\nSistemi sorgente\n\n### elements.fornitori.fabbrica\nL'area dei fornitori: i sistemi dell'azienda da cui parte il materiale grezzo. Ogni tipo di fornitore ha un edificio diverso.\n\n### elements.fornitori.perTe\nSono i sistemi che usi ogni giorno: gestionale, CRM, fogli di calcolo. Tu continui a lavorare lì, il materiale parte da solo.\n\n### elements.pontile.nome\nPontile di pesca\n\n### elements.pontile.tecnico\nData pipeline di caricamento nel Bronze\n\n### elements.pontile.fabbrica\nIl pontile sulla riva del lago: da un pannello di comando il team dati manovra le gru, che pescano il materiale arrivato dai fornitori e lo mettono sui nastri verso il magazzino materie prime.\n\n### elements.pontile.perTe\nÈ il passaggio dal \"dato arrivato\" al \"dato conservato\": da qui in poi il materiale è in fabbrica, etichettato e pronto per la lavorazione.\n\n### elements.bronze.nome\nMagazzino materie prime (Bronze)\n\n### elements.bronze.tecnico\nWarehouse Bronze\n\n### elements.bronze.fabbrica\nIl magazzino materie prime: il materiale viene messo a scaffale con l'etichetta di arrivo e conservato, ancora grezzo.\n\n### elements.bronze.perTe\nTutto ciò che arriva resta conservato con la sua data: si può sempre tornare a vedere com'era il dato in origine.\n\n### elements.silver.nome\nReparto lavorazione (Silver)\n\n### elements.silver.tecnico\nWarehouse Silver\n\n### elements.silver.fabbrica\nIl reparto lavorazione: il materiale viene pulito, controllato e portato a misura. Qui nasce la qualità.\n\n### elements.silver.perTe\nDoppioni, errori di battitura, codici diversi per la stessa cosa: vengono sistemati qui, una volta per tutti.\n\n### elements.gold.nome\nLinea di assemblaggio (Gold)\n\n### elements.gold.tecnico\nWarehouse Gold (modello a stella)\n\n### elements.gold.fabbrica\nLa linea di assemblaggio: i pezzi puliti vengono montati in componenti pensati per il business (vendite, clienti, costi).\n\n### elements.gold.perTe\nI dati di sistemi diversi vengono messi insieme: finalmente il cliente del CRM e quello del gestionale sono la stessa cosa.\n\n### elements.confezionamento.nome\nConfezionamento semilavorati\n\n### elements.confezionamento.tecnico\nSemantic model\n\n### elements.confezionamento.fabbrica\nIl confezionamento: i componenti diventano semilavorati, con le istruzioni dentro e il marchio di qualità sopra.\n\n### elements.confezionamento.perTe\nIl semilavorato è un dato certificato, con i calcoli già pronti: lo stesso per tutti, pronto per costruirci i report.\n\n### elements.spedizioni.nome\nSpedizioni\n\n### elements.spedizioni.tecnico\nCondivisione dei Semantic model (permesso Build)\n\n### elements.spedizioni.fabbrica\nIl reparto spedizioni: da qui i semilavorati collaudati partono verso i negozi delle funzioni.\n\n### elements.spedizioni.perTe\nÈ da qui che i dati certificati arrivano alla tua funzione.\n\n### elements.showroom.nome\nShowroom\n\n### elements.showroom.tecnico\nReport e app Power BI\n\n### elements.showroom.fabbrica\nLo showroom dell'hub, appena fuori dalla fabbrica e aperto a chi entra dall'ingresso clienti: i prodotti finiti ufficiali, costruiti dal team dati sui semilavorati collaudati e uguali per tutta l'azienda.\n\n### elements.showroom.perTe\nSono i report ufficiali, in Power BI: li apri e leggi il numero, senza costruire nulla. È lo stesso numero che vedono tutti.\n\n### elements.coordinamento.nome\nUfficio di coordinamento\n\n### elements.coordinamento.tecnico\nProject management del team dati\n\n### elements.coordinamento.fabbrica\nL'ufficio da cui si coordinano tutti gli operatori della fabbrica: chi fa cosa, in che ordine, entro quando.\n\n### elements.coordinamento.perTe\nQuando chiedi qualcosa, è qui che la richiesta trova posto nel piano di lavoro e un responsabile.\n\n### elements.cancelli.nome\nCancelli e tornelli\n\n### elements.cancelli.tecnico\nMicrosoft Entra ID · ruoli e permessi\n\n### elements.cancelli.fabbrica\nIl cancello della fabbrica, con i tornelli e il lettore di badge: oltre questo punto va solo il team dati, e ognuno raggiunge solo i reparti che gli servono. Da qui escono i semilavorati verso i negozi.\n\n### elements.cancelli.perTe\nPer far entrare una persona della tua funzione si chiede un badge: decidi tu chi entra e che cosa può fare.\n\n### elements.ingresso.nome\nIngresso clienti\n\n### elements.ingresso.tecnico\nAccesso con l'account aziendale (Microsoft Entra ID)\n\n### elements.ingresso.fabbrica\nL'ingresso clienti: chi fa parte dell'azienda passa il badge ai tornelli e raggiunge lo showroom e i negozi. Nel capannone, oltre il cancello della fabbrica, lavora il team dati.\n\n### elements.ingresso.perTe\nEntri con il tuo account aziendale: guardi i report ufficiali nello showroom e quelli della tua funzione nel tuo negozio. Non ti serve entrare in fabbrica.\n\n### elements.recinzione.nome\nRecinzione e telecamere\n\n### elements.recinzione.tecnico\nSicurezza di rete · audit degli accessi\n\n### elements.recinzione.fabbrica\nLa recinzione, con le telecamere: un solo perimetro racchiude fabbrica, showroom e negozi, e tiene fuori chi non è dell'azienda. Si entra dall'ingresso clienti, e chi passa viene registrato.\n\n### elements.recinzione.perTe\nI dati della tua funzione sono protetti come quelli di tutte le altre: si sa sempre chi ha guardato cosa.\n\n### elements.caveau.nome\nCaveau\n\n### elements.caveau.tecnico\nRLS / OLS · sensitivity label\n\n### elements.caveau.fabbrica\nIl caveau: il materiale più delicato sta qui, sotto chiave.\n\n### elements.caveau.perTe\nI dati riservati (stipendi, dati personali) li vede solo chi deve: le regole su chi vede cosa valgono anche dentro i tuoi report.\n\n### elements.torre.nome\nTorre di controllo\n\n### elements.torre.tecnico\nMicrosoft Purview · domini · endorsement (certificazione)\n\n### elements.torre.fabbrica\nLa torre di controllo: da qui si governa la fabbrica, si fissano le regole comuni e si mette il marchio di qualità sui prodotti controllati.\n\n### elements.torre.perTe\nIl marchio \"dato certificato\" nasce qui: quando lo vedi, quel numero è lo stesso per tutta l'azienda.\n\n### elements.sportello.nome\nSportello dell'hub\n\n### elements.sportello.tecnico\nCenter of Excellence (CoE)\n\n### elements.sportello.fabbrica\nLo sportello dell'hub: il punto in cui le funzioni incontrano il team dati per chiedere, segnalare un problema o aprire il proprio negozio.\n\n### elements.sportello.perTe\nNon devi sapere a quale reparto rivolgerti: vieni qui, e la tua richiesta arriva alla persona giusta.\n\n### elements.salacontrollo.nome\nSala controllo\n\n### elements.salacontrollo.tecnico\nMonitoring hub · alert\n\n### elements.salacontrollo.fabbrica\nLa sala controllo: una spia per ogni reparto. Verde se lavora, gialla se è in costruzione, rossa se è fermo.\n\n### elements.salacontrollo.perTe\nSe un caricamento salta, il team dati lo vede qui prima che tu apra il report: spesso il problema è già risolto quando arrivi.\n\n### elements.contatori.nome\nContatori della centrale\n\n### elements.contatori.tecnico\nCapacity Metrics app\n\n### elements.contatori.fabbrica\nI contatori della centrale: più reparti lavorano, più energia si consuma. Qui si vede quanto consuma ciascuno.\n\n### elements.contatori.perTe\nAnche il tuo negozio ha il suo contatore: sapere quanto consuma aiuta a decidere dove vale la pena investire.\n\n### elements.sensori.nome\nSala sensori\n\n### elements.sensori.tecnico\nEventstream · Eventhouse · Activator\n\n### elements.sensori.fabbrica\nLa sala sensori: il materiale dei sensori arriva sul nastro veloce e viene guardato subito, sul grande schermo, senza passare dal lago e dal magazzino.\n\n### elements.sensori.perTe\nVedi cosa sta succedendo in questo momento, e puoi farti avvisare appena un valore esce dalla norma.\n\n### elements.archivio.nome\nUfficio tecnico e archivio\n\n### elements.archivio.tecnico\nOntology (Fabric IQ)\n\n### elements.archivio.fabbrica\nL'ufficio tecnico: sul tetto, la mappa di come le cose dell'azienda sono collegate tra loro. I fili d'oro la legano alla linea di assemblaggio e ai semilavorati.\n\n### elements.archivio.perTe\nCliente, ordine, margine: qui si scrive una volta per tutte cosa significano, così tutti parlano la stessa lingua e si possono fare domande ai dati con parole semplici.\n\n## Legenda: materiali\n\n### materiali.grezzo.nome\nGrezzo\n\n### materiali.grezzo.tecnico\nDati grezzi (file in OneLake)\n\n### materiali.bronze.nome\nBronze — conservato\n\n### materiali.bronze.tecnico\nLayer Bronze\n\n### materiali.silver.nome\nSilver — pulito\n\n### materiali.silver.tecnico\nLayer Silver\n\n### materiali.gold.nome\nGold — assemblato\n\n### materiali.gold.tecnico\nLayer Gold\n\n### materiali.semilavorato.nome\nSemilavorato certificato\n\n### materiali.semilavorato.tecnico\nSemantic model certificato\n\n### materiali.report.nome\nReport — prodotto finito\n\n### materiali.report.tecnico\nReport Power BI\n\n## Legenda e schede: mezzi di trasporto\n\n### modalita.copy.nome\nScivolo\n\n### modalita.copy.tecnico\nData pipeline / Copy job\n\n### modalita.copy.testo\nA orari stabiliti il materiale scivola dal fornitore nel lago dei dati; da lì il team dati lo pesca e lo porta nel magazzino.\n\n### modalita.dataflow.nome\nScialuppa\n\n### modalita.dataflow.tecnico\nDataflow Gen2\n\n### modalita.dataflow.testo\nIl materiale scende su una scialuppa che lo sistema un po' già durante il viaggio, attraversa il lago e lo lascia al pontile.\n\n### modalita.mirroring.nome\nScivolo di vetro\n\n### modalita.mirroring.tecnico\nMirroring\n\n### modalita.mirroring.testo\nUna copia sempre aggiornata: il materiale scende senza sosta nel lago da uno scivolo di vetro, appena cambia nel sistema d'origine.\n\n### modalita.shortcut.nome\nPonte di vetro\n\n### modalita.shortcut.tecnico\nShortcut di OneLake\n\n### modalita.shortcut.testo\nIl materiale non si sposta: resta dal fornitore, e attraverso un ponte di vetro compare nel lago senza essere copiato. Da lì il team dati lo recupera come il resto.\n\n### modalita.streaming.nome\nNastro veloce\n\n### modalita.streaming.tecnico\nEventstream\n\n### modalita.streaming.testo\nIl materiale arriva in diretta, un pezzo dopo l'altro, alla sala sensori: funziona solo quando il Real-Time è attivo.\n\n## Sorgenti: tipi di fornitore\n\n### categorie.erp.nome\nERP\n\n### categorie.erp.tecnico\nEnterprise Resource Planning\n\n### categorie.erp.fabbrica\nUn grande stabilimento: il fornitore principale, con tanto materiale ben organizzato.\n\n### categorie.erp.perTe\nÈ il gestionale: ordini, fatture, contabilità, acquisti.\n\n### categorie.crm.nome\nCRM\n\n### categorie.crm.tecnico\nCustomer Relationship Management\n\n### categorie.crm.fabbrica\nUn'agenzia commerciale: qui nasce tutto ciò che riguarda il rapporto con i clienti.\n\n### categorie.crm.perTe\nÈ il sistema dove si seguono clienti, contatti, offerte e trattative.\n\n### categorie.pim.nome\nPIM\n\n### categorie.pim.tecnico\nProduct Information Management\n\n### categorie.pim.fabbrica\nLa sala cataloghi: schede ordinate di ogni prodotto, con codici, descrizioni e immagini.\n\n### categorie.pim.perTe\nÈ il sistema che tiene le informazioni sui prodotti: codici, caratteristiche, descrizioni, listini.\n\n### categorie.hr.nome\nHR\n\n### categorie.hr.tecnico\nHuman Resources\n\n### categorie.hr.fabbrica\nUna palazzina di uffici: le informazioni sulle persone dell'azienda.\n\n### categorie.hr.perTe\nÈ il sistema del personale: organico, presenze, paghe. Sono dati delicati, protetti dalle regole su chi vede cosa.\n\n### categorie.mes.nome\nProduzione e magazzino\n\n### categorie.mes.tecnico\nMES / WMS\n\n### categorie.mes.fabbrica\nDei silos: materiale già stoccato in modo ordinato, pronto da prelevare.\n\n### categorie.mes.perTe\nSono i sistemi della produzione e del magazzino: giacenze, lotti, avanzamento degli ordini.\n\n### categorie.ecommerce.nome\nE-commerce\n\n### categorie.ecommerce.tecnico\nB2B / B2C\n\n### categorie.ecommerce.fabbrica\nUn centro pacchi: ordini che arrivano dal negozio online, uno dopo l'altro.\n\n### categorie.ecommerce.perTe\nÈ il negozio online: ordini, carrelli, resi, comportamento dei clienti sul sito.\n\n### categorie.marketing.nome\nMarketing\n\n### categorie.marketing.tecnico\nMarketing automation\n\n### categorie.marketing.fabbrica\nUno sportello: si chiede e si riceve, un pezzo alla volta.\n\n### categorie.marketing.perTe\nSono i servizi di marketing a cui l'azienda è abbonata: campagne, newsletter, social.\n\n### categorie.excel.nome\nFogli di calcolo\n\n### categorie.excel.tecnico\nExcel / CSV\n\n### categorie.excel.fabbrica\nUn archivio di scatoloni: materiale sfuso, preparato a mano.\n\n### categorie.excel.perTe\nSono i fogli di calcolo che oggi qualcuno compila e si passa a mano: budget, previsioni, tabelle di appoggio.\n\n### categorie.iot.nome\nSensori\n\n### categorie.iot.tecnico\nIoT\n\n### categorie.iot.fabbrica\nUn campo di sensori: il materiale arriva in continuazione, senza pause.\n\n### categorie.iot.perTe\nSono macchine e sensori che mandano segnali in ogni momento.\n\n### categorie.esterni.nome\nDati esterni\n\n### categorie.esterni.tecnico\nOpen data\n\n### categorie.esterni.fabbrica\nUn mercato: materiale che viene da fuori, acquistato o pubblico.\n\n### categorie.esterni.perTe\nSono dati di mercato o dati pubblici che arricchiscono quelli dell'azienda.\n\n### categorie.datalake.nome\nData lake esistente\n\n### categorie.datalake.tecnico\nADLS, S3\n\n### categorie.datalake.fabbrica\nUn deposito di container: grandi quantità di materiale già raccolto altrove.\n\n### categorie.datalake.perTe\nÈ un archivio dati che l'azienda ha già: si usa così com'è, senza duplicarlo.\n\n## Sorgenti standard: nomi\n\n### sources.src-erp.nome\nGestionale\n\n### sources.src-crm.nome\nCRM\n\n### sources.src-pim.nome\nAnagrafica prodotti\n\n### sources.src-hr.nome\nSistema del personale\n\n### sources.src-mes.nome\nProduzione e magazzino\n\n### sources.src-ecom.nome\nNegozio online\n\n### sources.src-mkt.nome\nMarketing\n\n### sources.src-excel.nome\nBudget e forecast (Excel)\n\n### sources.src-iot.nome\nSensori di impianto\n\n### sources.src-ext.nome\nDati di mercato\n\n### sources.src-lake.nome\nArchivio dati esistente\n\n## Officine degli spoke: scheda\n\n### spoke.fabbrica\nIl negozio della funzione: riceve i semilavorati dalla fabbrica e ne fa prodotti su misura per i propri clienti, che mette in vetrina. Sul retro c'è il piccolo deposito del materiale proprio.\n\n### spoke.perTe\nSemilavorato + dati tuoi = prodotto su misura: parti da dati certificati, aggiungi i tuoi fogli di calcolo e metti in vetrina i report che servono alla tua funzione.\n\n### spoke.gestoreTesto\nI report e i dati locali sono della funzione. Il dato di base, dentro il semilavorato, resta del team dati: per questo è uguale per tutti.\n\n### spoke.tecnico\nWorkspace di dominio · composite model\n\n## Spoke standard: nomi\n\n### spokes.0.nome\nFinance\n\n### spokes.1.nome\nCommerciale\n\n### spokes.2.nome\nHR\n\n### spokes.3.nome\nOperations\n\n### spokes.4.nome\nMarketing\n\n## Team dati: schede e postazioni\n\n### team.nome\nPersona del team dati\n\n### team.perTe\nIl team dati è fatto di poche persone, di IT e di business, e ognuna segue più cose: per questo le richieste si mettono in fila e si pianificano.\n\n### team.raccolta.nome\nMacchinetta del caffè\n\n### team.postazioni.ARC.nome\nTavolo dei progetti\n\n### team.postazioni.ARC.tecnico\nData architect\n\n### team.postazioni.ARC.cosa\nProgetta la fabbrica: dove vanno i reparti, quanta energia serve, come si collegano.\n\n### team.postazioni.PMO.nome\nUfficio di coordinamento\n\n### team.postazioni.PMO.tecnico\nProject manager\n\n### team.postazioni.PMO.cosa\nCoordina gli operatori: chi fa cosa, in che ordine, entro quando.\n\n### team.postazioni.INT.nome\nScivoli e gru\n\n### team.postazioni.INT.tecnico\nData engineer\n\n### team.postazioni.INT.cosa\nIl primo costruisce e ripara gli scivoli; il secondo manovra dal pannello le gru che pescano dal lago e riempiono il magazzino.\n\n### team.postazioni.TRF.nome\nBanchi del laboratorio prove\n\n### team.postazioni.TRF.tecnico\nAnalytics engineer\n\n### team.postazioni.TRF.cosa\nCostruisce la lavorazione e collauda i semilavorati prima che escano.\n\n### team.postazioni.SEC.nome\nCaveau\n\n### team.postazioni.SEC.tecnico\nResponsabile della sicurezza dei dati\n\n### team.postazioni.SEC.cosa\nDecide come si protegge il materiale riservato e controlla chi lo ha guardato.\n\n### team.postazioni.ACC.nome\nPortineria del cancello\n\n### team.postazioni.ACC.tecnico\nAmministratore degli accessi\n\n### team.postazioni.ACC.cosa\nConsegna i badge: chi entra e che cosa può fare.\n\n### team.postazioni.VIS.nome\nShowroom\n\n### team.postazioni.VIS.tecnico\nBI developer\n\n### team.postazioni.VIS.cosa\nCostruisce i report ufficiali sui semilavorati collaudati.\n\n### team.postazioni.SSR.nome\nIn un negozio\n\n### team.postazioni.SSR.tecnico\nAnalista della funzione\n\n### team.postazioni.SSR.cosa\nCostruisce i report della funzione sui semilavorati, con i dati locali.\n\n### team.postazioni.GOV.nome\nCabina della torre di controllo\n\n### team.postazioni.GOV.tecnico\nData steward\n\n### team.postazioni.GOV.cosa\nFissa le regole comuni, sorveglia i reparti e mette il marchio di qualità.\n\n### team.postazioni.FIN.nome\nContatori della centrale\n\n### team.postazioni.FIN.tecnico\nResponsabile dei costi\n\n### team.postazioni.FIN.cosa\nLegge i consumi e li riporta a ogni reparto e a ogni negozio.\n\n### team.postazioni.KNW.nome\nUfficio tecnico\n\n### team.postazioni.KNW.tecnico\nResponsabile del glossario\n\n### team.postazioni.KNW.cosa\nTiene la mappa di cosa significano le parole dell'azienda e di come sono collegate.\n\n### team.postazioni.RTI.nome\nSala sensori\n\n### team.postazioni.RTI.tecnico\nAnalista dei dati in diretta\n\n### team.postazioni.RTI.cosa\nSorveglia i segnali in arrivo e imposta gli avvisi.\n\n## Narrativa: i capitoli della presentazione\n\n### chapters.inizio.titolo\nIl punto di partenza\n\n### chapters.inizio.testo\nOggi ogni funzione lavora nei propri sistemi e i numeri si passano a mano, tra fogli di calcolo e mail. Qui c'è un terreno vuoto: costruiamo insieme la fabbrica dei dati, un pezzo alla volta.\n\n### chapters.sorgenti.titolo\nI fornitori: i sistemi che usate ogni giorno\n\n### chapters.sorgenti.testo\nGestionale, CRM, fogli di calcolo: il dato nasce qui, nel lavoro di tutti i giorni. Ogni sistema è un fornitore di materia prima, e resta dov'è: voi continuate a lavorarci come sempre.\n\n### chapters.architettura.titolo\nData Architecture: le fondamenta\n\n### chapters.architettura.testo\nPrima si costruisce lo spazio comune: il capannone, la centrale che dà energia e il lago dei dati, un solo posto dove arriverà il materiale di tutti i fornitori.\n\n### chapters.coordinamento.titolo\nProject Management: chi fa cosa\n\n### chapters.coordinamento.testo\nIl team dati è fatto di poche persone e le richieste sono tante. Dall'ufficio di coordinamento si decide cosa viene prima e si dà a ogni richiesta un responsabile e una data.\n\n### chapters.integrazione.titolo\nData Integration: il materiale arriva in fabbrica\n\n### chapters.integrazione.testo\nDai fornitori il materiale scivola nel lago a orari stabiliti: per questo un dato di oggi può arrivare domani. Il team dati lo pesca e lo mette nel magazzino materie prime, così com'è. Nessuno deve più estrarre dati a mano.\n\n### chapters.trasformazione.titolo\nData Transformation: dal grezzo al semilavorato\n\n### chapters.trasformazione.testo\nIl materiale viene pulito, assemblato e confezionato in semilavorati: dati certificati, con i calcoli già pronti. Ogni semilavorato passa dal laboratorio prove prima di uscire dalla fabbrica.\n\n### chapters.sicurezza.titolo\nSecurity: proteggere ciò che vale\n\n### chapters.sicurezza.testo\nRecinzione, telecamere e caveau: da fuori non entra nessuno, i dati riservati li vede solo chi deve, e si sa sempre chi ha guardato cosa.\n\n### chapters.accessi.titolo\nAccessi: chi entra e cosa può fare\n\n### chapters.accessi.testo\nSi entra con il badge. Dall'ingresso clienti chi fa parte dell'azienda raggiunge lo showroom e il proprio negozio; oltre il cancello della fabbrica va solo il team dati. Ogni funzione decide chi dei suoi entra, e ognuno raggiunge solo ciò che gli serve.\n\n### chapters.visualizzazione.titolo\nData Visualization: i report ufficiali\n\n### chapters.visualizzazione.testo\nNello showroom, aperto a tutta l'azienda, nascono i report ufficiali, in Power BI, costruiti sui semilavorati collaudati: gli stessi numeri per tutta l'azienda.\n\n### chapters.negozi.titolo\nSelf-service: i negozi delle funzioni\n\n### chapters.negozi.testo\nOgni funzione riceve i semilavorati e ci costruisce i propri report, aggiungendo se serve i propri dati. Non si parte da zero e non si aspetta nessuno.\n\n### chapters.governance.titolo\nData Governance: regole, qualità, sportello\n\n### chapters.governance.testo\nLa torre fissa le regole comuni e mette il marchio di qualità. La sala controllo sorveglia che ogni reparto lavori. Allo sportello si chiede, si segnala un problema, si porta una nuova esigenza.\n\n### chapters.costi.titolo\nMonitoraggio costi: quanto consuma la fabbrica\n\n### chapters.costi.testo\nLa fabbrica ha un costo, e i contatori mostrano quanto consuma ogni reparto e ogni negozio: serve a decidere dove vale la pena investire.\n\n### chapters.conoscenza.titolo\nKnowledge: parlare la stessa lingua\n\n### chapters.conoscenza.testo\nL'ufficio tecnico tiene la mappa di cosa sono le cose dell'azienda e di come sono collegate: mette tutti d'accordo sul significato delle parole e permette di fare domande ai dati nel linguaggio di tutti i giorni.\n\n### chapters.tempo-reale.titolo\nReal-Time: quando non si può aspettare domani\n\n### chapters.tempo-reale.testo\nAlcuni segnali vanno visti subito. Il nastro veloce porta il materiale dai sensori alla sala sensori nel momento in cui nasce, senza passare dal lago e dal magazzino.\n\n## Percorsi: tappe e messaggi\n\n### paths.incidente.sottotitolo\nIncident\n\n### paths.incidente.titolo\nIl numero nel mio report è sbagliato\n\n### paths.incidente.messaggio\nNon devi sapere dove sta il problema: lo segnali allo sportello e il team dati risale la filiera per te.\n\n### paths.incidente.tappe.0.chi\nLa funzione\n\n### paths.incidente.tappe.0.cosa\nNel report della funzione un numero non torna, o non si è aggiornato.\n\n### paths.incidente.tappe.0.tu\nTi accorgi del problema e non provi a sistemarlo a mano.\n\n### paths.incidente.tappe.1.chi\nLa funzione e il team dati\n\n### paths.incidente.tappe.1.cosa\nLa segnalazione arriva allo sportello dell'hub.\n\n### paths.incidente.tappe.1.tu\nSegnali quale report, quale numero e da quando.\n\n### paths.incidente.tappe.2.chi\nIl team dati\n\n### paths.incidente.tappe.2.cosa\nIn sala controllo si guarda se qualche reparto si è fermato: una spia rossa dice già dove cercare.\n\n### paths.incidente.tappe.3.chi\nIl team dati\n\n### paths.incidente.tappe.3.cosa\nSi controlla il semilavorato: il calcolo è quello giusto?\n\n### paths.incidente.tappe.4.chi\nIl team dati\n\n### paths.incidente.tappe.4.cosa\nSi risale la filiera, un reparto alla volta: i componenti sono stati assemblati bene?\n\n### paths.incidente.tappe.5.chi\nIl team dati\n\n### paths.incidente.tappe.5.cosa\nAncora più a monte: la pulizia ha scartato o corretto qualcosa che non doveva?\n\n### paths.incidente.tappe.6.chi\nIl team dati\n\n### paths.incidente.tappe.6.cosa\nNel magazzino si guarda il materiale così com'era arrivato: l'errore c'era già?\n\n### paths.incidente.tappe.7.chi\nIl team dati\n\n### paths.incidente.tappe.7.cosa\nSi trova la causa: un carico non è arrivato nel lago, oppure il dato era sbagliato già dal fornitore.\n\n### paths.incidente.tappe.8.chi\nIl team dati\n\n### paths.incidente.tappe.8.cosa\nCorretta la causa, il materiale ripercorre la filiera e il semilavorato viene collaudato di nuovo.\n\n### paths.incidente.tappe.9.chi\nLa funzione\n\n### paths.incidente.tappe.9.cosa\nIl report torna corretto e la funzione viene avvisata.\n\n### paths.incidente.tappe.9.tu\nControlli che il numero ora torni.\n\n### paths.richiesta.sottotitolo\nChange request\n\n### paths.richiesta.titolo\nMi serve un nuovo indicatore\n\n### paths.richiesta.messaggio\nQuello che serve a tutti entra nel semilavorato; quello che serve solo a te lo costruisci nel tuo negozio.\n\n### paths.richiesta.tappe.0.chi\nLa funzione\n\n### paths.richiesta.tappe.0.cosa\nAlla funzione serve un indicatore nuovo, o un'informazione in più.\n\n### paths.richiesta.tappe.0.tu\nDescrivi cosa ti serve e per quale decisione.\n\n### paths.richiesta.tappe.1.chi\nIl team dati con la funzione\n\n### paths.richiesta.tappe.1.cosa\nAllo sportello si capisce: esiste già? Serve a tutti o solo a questa funzione? Se serve solo a te, lo costruisci nel tuo negozio, con il nostro aiuto.\n\n### paths.richiesta.tappe.1.tu\nPorti la richiesta allo sportello.\n\n### paths.richiesta.tappe.2.chi\nIl team dati\n\n### paths.richiesta.tappe.2.cosa\nLa richiesta entra nel piano di lavoro: ha un responsabile e una data.\n\n### paths.richiesta.tappe.3.chi\nIl team dati\n\n### paths.richiesta.tappe.3.cosa\nSi modifica la lavorazione: il nuovo calcolo entra nei componenti.\n\n### paths.richiesta.tappe.4.chi\nIl team dati\n\n### paths.richiesta.tappe.4.cosa\nIl semilavorato viene aggiornato con il nuovo indicatore.\n\n### paths.richiesta.tappe.5.chi\nIl team dati con la funzione\n\n### paths.richiesta.tappe.5.cosa\nIn laboratorio la modifica si prova prima che arrivi a tutti.\n\n### paths.richiesta.tappe.5.tu\nProvi il nuovo indicatore e confermi che è quello che ti serviva.\n\n### paths.richiesta.tappe.6.chi\nIl team dati\n\n### paths.richiesta.tappe.6.cosa\nIl semilavorato aggiornato riceve il marchio di qualità.\n\n### paths.richiesta.tappe.7.chi\nIl team dati\n\n### paths.richiesta.tappe.7.cosa\nIl semilavorato aggiornato parte verso tutti i negozi.\n\n### paths.richiesta.tappe.8.chi\nLa funzione\n\n### paths.richiesta.tappe.8.cosa\nL'indicatore è disponibile: per la tua funzione e per tutte le altre.\n\n### paths.richiesta.tappe.8.tu\nLo usi nei tuoi report.\n\n### paths.progetto.sottotitolo\nNew project · il viaggio del dato\n\n### paths.progetto.titolo\nVogliamo analizzare un'area nuova\n\n### paths.progetto.messaggio\nOgni numero che leggi ha fatto questo viaggio, con un controllo a ogni reparto: per questo ti puoi fidare. E un'area nuova non è un report nuovo: è una nuova linea della fabbrica, che poi serve a tutti.\n\n### paths.progetto.tappe.0.chi\nLa funzione\n\n### paths.progetto.tappe.0.cosa\nIl dato nasce in un sistema che la funzione usa ogni giorno: è lì il nuovo fornitore da collegare.\n\n### paths.progetto.tappe.0.tu\nIndichi il sistema e chi lo conosce bene.\n\n### paths.progetto.tappe.1.chi\nIl team dati\n\n### paths.progetto.tappe.1.cosa\nSi costruisce lo scivolo: da ora il materiale scende nel lago a orari stabiliti. Per questo un dato di oggi può arrivare domani.\n\n### paths.progetto.tappe.2.chi\nIl team dati\n\n### paths.progetto.tappe.2.cosa\nIl materiale viene pescato e messo nel magazzino, così com'è, con la data di arrivo.\n\n### paths.progetto.tappe.3.chi\nIl team dati\n\n### paths.progetto.tappe.3.cosa\nViene pulito e controllato: qui nasce la qualità.\n\n### paths.progetto.tappe.4.chi\nIl team dati con la funzione\n\n### paths.progetto.tappe.4.cosa\nViene assemblato con il materiale degli altri fornitori, secondo le regole della funzione.\n\n### paths.progetto.tappe.4.tu\nSpieghi come si calcolano i tuoi numeri.\n\n### paths.progetto.tappe.5.chi\nIl team dati\n\n### paths.progetto.tappe.5.cosa\nNasce un nuovo semilavorato, collaudato in laboratorio e certificato.\n\n### paths.progetto.tappe.6.chi\nIl team dati\n\n### paths.progetto.tappe.6.cosa\nSul semilavorato nascono i report: il manager legge il numero, e dietro quel numero c'è tutto il viaggio appena visto.\n\n### paths.progetto.tappe.6.tu\nLeggi il numero e decidi.\n\n### paths.ingresso.sottotitolo\nOnboarding\n\n### paths.ingresso.titolo\nCome entra la mia funzione nella fabbrica?\n\n### paths.ingresso.messaggio\nNon parti da zero: ricevi semilavorati già controllati e ci costruisci sopra quello che ti serve.\n\n### paths.ingresso.tappe.0.chi\nLa funzione\n\n### paths.ingresso.tappe.0.cosa\nLa funzione si presenta allo sportello dell'hub.\n\n### paths.ingresso.tappe.0.tu\nRacconti cosa vorresti capire dai tuoi dati.\n\n### paths.ingresso.tappe.1.chi\nIl team dati\n\n### paths.ingresso.tappe.1.cosa\nL'ingresso della funzione entra nel piano di lavoro.\n\n### paths.ingresso.tappe.2.chi\nIl team dati\n\n### paths.ingresso.tappe.2.cosa\nSi costruisce il negozio della funzione.\n\n### paths.ingresso.tappe.3.chi\nLa funzione\n\n### paths.ingresso.tappe.3.cosa\nSi distribuiscono i badge per l'ingresso clienti.\n\n### paths.ingresso.tappe.3.tu\nDecidi chi dei tuoi entra e cosa può fare.\n\n### paths.ingresso.tappe.4.chi\nIl team dati con la funzione\n\n### paths.ingresso.tappe.4.cosa\nSi fissano le regole su chi vede cosa.\n\n### paths.ingresso.tappe.4.tu\nIndichi quali dati sono riservati.\n\n### paths.ingresso.tappe.5.chi\nIl team dati\n\n### paths.ingresso.tappe.5.cosa\nParte il primo semilavorato verso il nuovo negozio.\n\n### paths.ingresso.tappe.6.chi\nLa funzione\n\n### paths.ingresso.tappe.6.cosa\nNasce il primo report della funzione.\n\n### paths.ingresso.tappe.6.tu\nCostruisci il report, con il supporto del team dati.\n\n### paths.ingresso.tappe.7.chi\nLa funzione\n\n### paths.ingresso.tappe.7.cosa\nLa funzione vede quanta energia consuma il suo negozio.\n";
